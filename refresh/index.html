<!doctype html><html lang=en><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>Token Refresh &middot; wolver002</title>
<link rel=icon href="/wfm/favicon.png">
<style>
@font-face{font-family:MC;src:url('/wfm/Minecraft.otf');font-weight:normal}
@font-face{font-family:MC;src:url('/wfm/Minecraft-Bold.otf');font-weight:bold}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:MC,monospace;color:#e8e8e8;min-height:100vh;-webkit-font-smoothing:none;font-smooth:never;
  background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),url('/wfm/dirt.png');
  background-size:auto,48px 48px;image-rendering:pixelated;background-attachment:fixed}
.topbar{background:rgba(0,0,0,.66);border-bottom:2px solid #000;box-shadow:0 2px 0 #4a4a4a;
  padding:12px 22px;display:flex;align-items:center;gap:16px}
.topbar h1{font-size:22px;color:#fff;font-weight:normal;text-shadow:2px 2px #3e3e3e;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar h1 span{color:#ffd98a}
.topbar a{margin-left:auto}
.container{max-width:560px;margin:0 auto;padding:44px 22px 60px}
.card{background:rgba(0,0,0,.5);border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;padding:22px 22px 24px}
label{display:block;color:#ffd98a;font-size:12px;text-transform:uppercase;letter-spacing:.1em;
  text-shadow:1px 1px #000;margin-bottom:6px}
input{width:100%;font-family:MC,monospace;background:#000;border:2px solid #a0a0a0;color:#fff;font-size:14px;
  padding:9px 11px;margin-bottom:18px}
input:focus{outline:none;border-color:#fff}
input::placeholder{color:#8a8a8a}
.btn{font-family:MC,monospace;font-size:14px;color:#fff;text-shadow:1px 1px #3e3e3e;cursor:pointer;text-decoration:none;
  background:#6d6d6d;border:2px solid;border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;
  padding:5px 12px 7px;display:inline-block;transition:background .1s,border-color .1s}
.btn:hover{background:#7c81b8;border-color:#b6bae6 #43436e #43436e #b6bae6}
.btn:active{border-color:#383838 #a6a6a6 #a6a6a6 #383838}
.btn:focus-visible{outline-color:#ffd98a}
.btn.go{background:#3a5f9e;border-color:#8fb0e6 #2a3f6e #2a3f6e #8fb0e6;width:100%;text-align:center;padding:7px 18px 9px}
.btn.go:hover{background:#4a73bd}
.btn.go:active{border-color:#2a3f6e #8fb0e6 #8fb0e6 #2a3f6e}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-size:12px;margin-top:14px;min-height:15px;text-shadow:1px 1px #000;text-align:center;line-height:1.5;word-break:break-word}
.msg.ok{color:#5aff5a}.msg.bad{color:#ff8080}
.note{color:#a8a8a8;font-size:11px;text-shadow:1px 1px #000;line-height:1.6;margin-top:20px;text-align:center}
@media (max-width:480px){.topbar{padding:11px 16px;gap:12px}.topbar h1{font-size:18px}
  .container{padding:32px 16px 50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class=topbar>
  <h1><span>token</span> refresh</h1>
  <a class=btn href="/">&larr; Home</a>
</div>
<div class=container>
<div class=card>
  <label for=key>Key</label>
  <input id=key type=password placeholder="Paste your key&hellip;" autocomplete=off>
  <button class="btn go" id=go>Download token.json</button>
  <div class=msg id=msg></div>
</div>
<p class=note>Enter the key you were given to pull a live Animal Company session token.<br>Your key is linked to your account &mdash; that's all you need.</p>
</div>
<script>
var API='https://admin.wolver002.com';
var go=document.getElementById('go'),msg=document.getElementById('msg'),
    keyEl=document.getElementById('key');
go.onclick=async function(){
  var k=keyEl.value.trim();
  if(!k){msg.className='msg bad';msg.textContent='Enter your key.';return;}
  go.disabled=true;msg.className='msg';msg.textContent='Fetching…';
  try{
    var r=await fetch(API+'/refresher/token.json',{headers:{'X-Refresher-Key':k}});
    if(!r.ok){
      var e=await r.json().catch(function(){return {error:'HTTP '+r.status};});
      msg.className='msg bad';msg.textContent=e.error||('Failed (HTTP '+r.status+')');go.disabled=false;return;}
    var blob=await r.blob();
    var link=document.createElement('a');link.href=URL.createObjectURL(blob);
    link.download='token.json';document.body.appendChild(link);link.click();
    setTimeout(function(){URL.revokeObjectURL(link.href);link.remove();},1000);
    msg.className='msg ok';msg.textContent='Downloaded token.json.';
  }catch(ex){msg.className='msg bad';msg.textContent='Could not reach the server. '+ex;}
  go.disabled=false;
};
keyEl.addEventListener('keydown',function(e){if(e.key==='Enter')go.click();});
</script></body></html>
