<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Refresher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235a8f3c'/><rect y='10' width='16' height='6' fill='%236b4b2a'/></svg>">
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo-block"></span>
    <h1>TOKEN REFRESHER</h1>
  </div>
  <div class="brand-right">
    <span class="acct-box">
      <span class="acct-label">acct</span>
      <span id="acct-name" class="acct-name">-</span>
    </span>
    <span id="dot" class="dot"></span>
  </div>
</header>

<main>

  <div class="col">

    <!-- STATUS -->
    <section class="card">
      <div class="card-head">
        <h2>Status</h2>
        <span id="run-pill" class="pill dim">stopped</span>
      </div>
      <div class="status-grid">
        <div class="stat">
          <div class="stat-k">In use</div>
          <div class="stat-v" id="s-source">none</div>
        </div>
        <div class="stat">
          <div class="stat-k">Expires in</div>
          <div class="stat-v big" id="s-countdown">—</div>
        </div>
        <div class="stat">
          <div class="stat-k">Last refresh</div>
          <div class="stat-v" id="s-last">never</div>
        </div>
        <div class="stat">
          <div class="stat-k">Endpoint</div>
          <div class="stat-v mono" id="s-endpoint">—</div>
        </div>
      </div>
      <div class="source-row">
        <span class="src-label">Source</span>
        <button id="btn-src-pile" class="btn small">Use pile · random</button>
        <span id="src-now" class="dim mono"></span>
      </div>
      <div id="s-error" class="banner err hidden"></div>
      <div class="btn-row">
        <button id="btn-start" class="btn green">Start</button>
        <button id="btn-stop" class="btn">Stop</button>
        <button id="btn-refresh" class="btn blue">Refresh now</button>
      </div>
    </section>

    <!-- PILE KEY (global, tied to no account) -->
    <section class="card">
      <div class="card-head">
        <h2>Pile key</h2>
        <span id="key-pill" class="pill dim">not linked</span>
      </div>
      <label class="field"><span>Key</span>
        <input id="in-key" type="text" spellcheck="false" placeholder="XXXXXX-XXXXXX-XXXXXX-..."></label>
      <div class="btn-row">
        <button id="btn-link-key" class="btn green">Link key</button>
        <button id="btn-test-key" class="btn">Test</button>
        <button id="btn-show-key" class="btn">Show key</button>
        <button id="btn-unlink-key" class="btn">Unlink</button>
        <span id="key-state" class="dim"></span>
      </div>
    </section>

  </div>

  <div class="col">

    <!-- PERSONAL TOKENS -->
    <section class="card">
      <div class="card-head">
        <h2>Personal tokens</h2>
        <span id="pers-pill" class="pill dim">0 saved</span>
      </div>
      <div id="pers-list" class="pile"></div>
      <div class="add">
        <label class="field"><span>Bearer</span>
          <textarea id="in-bearer" spellcheck="false" placeholder="eyJhbGciOi..."></textarea></label>
        <label class="field"><span>Refresh token</span>
          <textarea id="in-refresh" spellcheck="false" placeholder="eyJhbGciOi..."></textarea></label>
        <label class="field"><span>Label</span>
          <input id="in-label" type="text" spellcheck="false" placeholder="e.g. my alt"></label>
        <div class="btn-row">
          <button id="btn-save-personal" class="btn green">Save my token</button>
        </div>
      </div>
    </section>

  </div>

</main>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
