<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Token Refresher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235a8f3c'/><rect y='10' width='16' height='6' fill='%236b4b2a'/></svg>">
<style>
  .dc-user{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .dc-avatar{width:34px;height:34px;border-radius:6px;image-rendering:auto;border:2px solid #3a3128}
  .dc-avatar.hidden{display:none}
  .dc-name{font-size:20px}
  .btn.discord{background:#5865F2;border-color:#4752c4;color:#fff}
  .btn.discord:hover{background:#6b76f6}
  .dc-hint{margin:0 0 10px;opacity:.7}
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="logo-block"></span>
    <h1>TOKEN REFRESHER</h1>
  </div>
  <div class="brand-right">
    <span class="acct-box">
      <span class="acct-label">acct</span>
      <span id="acct-name" class="acct-name">-</span>
    </span>
    <span id="dot" class="dot"></span>
  </div>
</header>

<main>

  <div class="col">

    <!-- STATUS -->
    <section class="card">
      <div class="card-head">
        <h2>Status</h2>
        <span id="run-pill" class="pill dim">stopped</span>
      </div>
      <div class="src2" id="src2">
        <button class="seg on" id="src-key" data-src="pile">key token</button>
        <button class="seg" id="src-personal" data-src="personal">personal token</button>
      </div>
      <div class="btn-row">
        <button id="btn-get" class="btn green">Get token</button>
      </div>
      <div id="s-error" class="banner err hidden"></div>
    </section>

    <!-- ACCOUNT -> DISCORD -> KEY (register, link Discord, generate your key) -->
    <section class="card">
      <div class="card-head">
        <h2>Your key</h2>
        <span id="key-pill" class="pill dim">logged out</span>
      </div>

      <!-- logged out: account form -->
      <div id="acct-form">
        <p class="dc-hint">Create an account (or log in), link your Discord, then get your key.</p>
        <label class="field"><span>Username</span>
          <input id="in-user" type="text" spellcheck="false" autocomplete="username" placeholder="3-20 letters / numbers / _"></label>
        <label class="field"><span>Password</span>
          <input id="in-pass" type="password" autocomplete="current-password" placeholder="min 6 characters"></label>
        <div class="btn-row">
          <button id="btn-login" class="btn green">Log in</button>
          <button id="btn-register" class="btn">Create account</button>
          <span id="acct-msg" class="dim"></span>
        </div>
      </div>

      <!-- logged in -->
      <div id="acct-in" class="hidden">
        <div class="dc-user">
          <img id="dc-avatar" class="dc-avatar hidden" alt="">
          <span id="acct-who" class="dc-name">-</span>
        </div>

        <div id="link-row">
          <p class="dc-hint">Link your Discord to unlock your key.</p>
          <div class="btn-row">
            <button id="btn-discord" class="btn discord">Link Discord</button>
          </div>
        </div>

        <div id="key-row" class="hidden">
          <label class="field"><span>Key</span>
            <input id="in-key" type="text" spellcheck="false" readonly placeholder="generate your key →"></label>
          <div class="btn-row">
            <button id="btn-gen-key" class="btn green">Generate key</button>
            <button id="btn-copy-key" class="btn hidden">Copy key</button>
          </div>
        </div>

        <div class="btn-row" style="margin-top:12px">
          <button id="btn-logout" class="btn">Log out</button>
          <span id="key-state" class="dim"></span>
        </div>
      </div>
    </section>

  </div>

  <div class="col">

    <!-- PERSONAL TOKENS -->
    <section class="card">
      <div class="card-head">
        <h2>Personal tokens</h2>
        <span id="pers-pill" class="pill dim">0 saved</span>
      </div>
      <div id="pers-list" class="pile"></div>
      <div class="add">
        <label class="field"><span>Bearer</span>
          <textarea id="in-bearer" spellcheck="false" placeholder="eyJhbGciOi..."></textarea></label>
        <label class="field"><span>Refresh token</span>
          <textarea id="in-refresh" spellcheck="false" placeholder="eyJhbGciOi..."></textarea></label>
        <label class="field"><span>Label</span>
          <input id="in-label" type="text" spellcheck="false" placeholder="e.g. my alt"></label>
        <div class="btn-row">
          <button id="btn-save-personal" class="btn green">Save my token</button>
        </div>
      </div>
    </section>

  </div>

</main>

<div id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
