<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
      --accent: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --blue: #3b82f6;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, monospace;
      overflow: hidden;
    }
    #map {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #080808;
      z-index: 1;
    }
    .leaflet-container { background: #080808; }
    .leaflet-control-zoom a {
      background: var(--card) !important;
      color: var(--fg) !important;
      border-color: var(--line) !important;
    }
    .leaflet-control-zoom a:hover { background: #1a1a1e !important; }
    .top-bar {
      position: absolute;
      top: 12px; left: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      background: rgba(17,17,20,0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      backdrop-filter: blur(8px);
    }
    .top-bar a {
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
    }
    .top-bar a:hover { color: var(--fg); }
    .top-bar h1 {
      font-size: 15px;
      font-weight: 600;
      font-family: ui-sans-serif, system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    .coord-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(17,17,20,0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 13px;
      color: var(--fg);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .panel {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 260px;
      max-height: calc(100% - 24px);
      border-radius: 8px;
      border: 1px solid var(--line);
      z-index: 1000;
      background: rgba(17,17,20,0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel.collapsed { width: 40px; border-radius: 8px; }
    .panel.collapsed .panel-content { display: none; }
    .panel.collapsed .panel-toggle { border-bottom: none; }
    .panel-toggle {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .panel-toggle:hover { background: rgba(255,255,255,0.03); }
    .panel-toggle span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--accent);
    }
    .panel-toggle .arrow { color: var(--muted); font-size: 14px; }
    .panel-content { flex: 1; overflow-y: auto; }
    .goto-section {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .goto-section label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }
    .goto-row {
      display: flex;
      gap: 6px;
    }
    .goto-row input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--fg);
      font: inherit;
      font-size: 12px;
      padding: 6px 8px;
      outline: none;
      width: 0;
    }
    .goto-row input:focus { border-color: #333; }
    .goto-row button {
      padding: 6px 12px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: #000;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .goto-row button:hover { opacity: 0.85; }
    .wp-add-section {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
    }
    .wp-add-btn {
      width: 100%;
      padding: 8px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: #000;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .wp-add-btn:hover { opacity: 0.85; }
    .wp-add-btn.active {
      background: var(--red);
      color: #fff;
    }
    .wp-list {
      padding: 4px 0;
    }
    .wp-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: background 100ms;
    }
    .wp-item:hover { background: rgba(255,255,255,0.04); }
    .wp-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .wp-info { flex: 1; min-width: 0; }
    .wp-name {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wp-coords {
      font-size: 10px;
      color: var(--muted);
    }
    .wp-del {
      background: none;
      border: none;
      color: #555;
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      line-height: 1;
    }
    .wp-del:hover { color: var(--red); }
    .wp-empty {
      padding: 20px 12px;
      text-align: center;
      font-size: 11px;
      color: #555;
    }
    .wp-form-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .wp-form-overlay.show { display: flex; }
    .wp-form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      width: 300px;
    }
    .wp-form h3 {
      font-size: 15px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      margin-bottom: 16px;
    }
    .wp-form label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 4px;
      margin-top: 12px;
    }
    .wp-form label:first-of-type { margin-top: 0; }
    .wp-form input[type=text] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
    }
    .wp-form input[type=text]:focus { border-color: #333; }
    .wp-form .color-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .wp-form .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 100ms;
    }
    .wp-form .color-swatch.sel { border-color: #fff; }
    .wp-form .color-swatch:hover { border-color: #888; }
    .wp-form .form-coords {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }
    .wp-form .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .wp-form .btn-row button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .wp-form .btn-save {
      background: var(--accent);
      color: #000;
    }
    .wp-form .btn-cancel {
      background: #222;
      color: var(--fg);
    }
    .track-section {
      padding: 10px 12px;
      border-top: 1px solid var(--line);
    }
    .track-section label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
    }
    .track-player-list {
      overflow-y: auto;
      flex: 1;
    }
    .track-player-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 0;
      font-size: 12px;
      cursor: pointer;
    }
    .track-player-item:hover { color: var(--accent); }
    .track-player-item .dot-on {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }
    .track-active {
      border-top: 1px solid var(--line);
      padding: 8px 12px;
    }
    .track-active-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      font-size: 11px;
    }
    .track-active-item .track-name {
      color: var(--accent);
      font-weight: 600;
    }
    .track-active-item .track-info {
      color: var(--muted);
      font-size: 10px;
    }
    .track-stop {
      background: none;
      border: none;
      color: var(--red);
      cursor: pointer;
      font-size: 12px;
      padding: 2px 4px;
    }
    .track-stop:hover { opacity: 0.7; }
    .track-form-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      justify-content: center;
      align-items: center;
    }
    .track-form-overlay.show { display: flex; }
    .track-form {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      width: 280px;
    }
    .track-form h3 {
      font-size: 15px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      margin-bottom: 16px;
    }
    .track-form label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      margin-bottom: 4px;
    }
    .track-form input[type=number] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      padding: 8px 10px;
      outline: none;
    }
    .track-form input[type=number]:focus { border-color: #333; }
    .track-form .player-label {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 12px;
    }
    .track-form .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    .track-form .btn-row button {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .track-form .btn-save { background: var(--accent); color: #000; }
    .track-form .btn-save:hover { opacity: 0.85; }
    .track-form .btn-cancel { background: #222; color: var(--fg); }
    .track-form .btn-cancel:hover { opacity: 0.85; }
    .left-panel {
      position: absolute;
      top: 56px;
      left: 12px;
      bottom: 12px;
      width: 200px;
      border-radius: 8px;
      border: 1px solid var(--line);
      z-index: 1000;
      background: rgba(17,17,20,0.95);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .left-panel.collapsed { width: 40px; }
    .left-panel.collapsed .left-panel-content { display: none; }
    .left-panel.collapsed .left-panel-toggle { border-bottom: none; }
    .left-panel-toggle {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .left-panel-toggle:hover { background: rgba(255,255,255,0.03); }
    .left-panel-toggle span {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
      color: var(--blue);
    }
    .left-panel-toggle .arrow { color: var(--muted); font-size: 14px; }
    .left-panel-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 6px 0;
    }
    .crosshair-cursor .leaflet-container { cursor: crosshair !important; }
    .leaflet-marker-icon.wp-marker {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-slider-wrap {
      position: absolute;
      right: 12px;
      bottom: 48px;
      z-index: 1000;
      background: rgba(17,17,20,0.95);
      border: 1px solid var(--line);
      border-radius: 8px;
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .zoom-slider-wrap label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .zoom-slider-wrap input[type=range] {
      width: 120px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .zoom-slider-val {
      font-size: 11px;
      color: var(--fg);
      font-family: ui-monospace, monospace;
      min-width: 22px;
      text-align: right;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="top-bar">
    <a href="/moding">&#8592; back</a>
    <h1>Factions Map</h1>
  </div>

  <div class="coord-bar" id="coord-bar">X: 0, Z: 0 | Chunk: 0, 0</div>

  <div class="zoom-slider-wrap">
    <label>Zoom</label>
    <input type="range" id="zoom-slider" min="-10" max="2" step="1" value="-4" />
    <span class="zoom-slider-val" id="zoom-val">-4</span>
  </div>

  <div class="panel" id="panel">
    <div class="panel-toggle" onclick="togglePanel()">
      <span>Waypoints</span>
      <span class="arrow" id="panel-arrow">&#9654;</span>
    </div>
    <div class="panel-content">
      <div class="goto-section">
        <label>Go to coordinates</label>
        <div class="goto-row">
          <input type="number" id="goto-x" placeholder="X" />
          <input type="number" id="goto-z" placeholder="Z" />
          <button onclick="gotoCoords()">Go</button>
        </div>
      </div>
      <div class="wp-add-section">
        <button class="wp-add-btn" id="wp-add-btn" onclick="toggleAddMode()">+ Add Waypoint</button>
      </div>
      <div class="wp-list" id="wp-list"></div>
    </div>
  </div>

  <div class="left-panel" id="left-panel">
    <div class="left-panel-toggle" onclick="toggleLeftPanel()">
      <span>Players</span>
      <span class="arrow" id="left-panel-arrow">&#9660;</span>
    </div>
    <div class="left-panel-content">
      <div class="track-player-list" id="track-player-list" style="padding:0 10px"></div>
      <div class="track-active" id="track-active"></div>
    </div>
  </div>

  <div class="wp-form-overlay" id="wp-form-overlay">
    <div class="wp-form">
      <h3>Add Waypoint</h3>
      <label>Name</label>
      <input type="text" id="wp-name" placeholder="My base" maxlength="30" autocomplete="off" />
      <label>Color</label>
      <div class="color-row" id="color-row"></div>
      <div class="form-coords" id="form-coords">X: 0, Z: 0</div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="cancelWaypoint()">Cancel</button>
        <button class="btn-save" onclick="saveWaypoint()">Save</button>
      </div>
    </div>
  </div>

  <div class="track-form-overlay" id="track-form-overlay">
    <div class="track-form">
      <h3>Track Player</h3>
      <div class="player-label" id="track-player-label"></div>
      <label>Interval (seconds)</label>
      <input type="number" id="track-interval" value="3" min="1" max="60" />
      <div class="btn-row">
        <button class="btn-cancel" onclick="cancelTrack()">Cancel</button>
        <button class="btn-save" onclick="startTrack()">Start</button>
      </div>
    </div>
  </div>

  <script>
    var TILE_URL = "https://better-factions-map--nightfall12.replit.app/api/map/chunk/{z}/{x}/{y}?t=" + Date.now();
    var TILE_SIZE = 256;
    var SCALE = 0.25;

    var map = L.map("map", {
      crs: L.CRS.Simple,
      minZoom: -10,
      maxZoom: 2,
      zoomSnap: 1,
      zoomDelta: 1,
      attributionControl: false,
      zoomControl: false
    });

    L.control.zoom({ position: "topleft" }).addTo(map);
    document.querySelector('.leaflet-control-zoom').style.marginTop = '60px';

    L.tileLayer(TILE_URL, {
      tileSize: TILE_SIZE,
      noWrap: true,
      maxNativeZoom: 0,
      minNativeZoom: -5,
      minZoom: -10,
      maxZoom: 2
    }).addTo(map);

    map.setView([0, 0], -4);

    var coordBar = document.getElementById("coord-bar");
    map.on("mousemove", function(e) {
      var g = latLngToGame(e.latlng);
      var cx = Math.floor(g.x / 16);
      var cz = Math.floor(g.z / 16);
      coordBar.textContent = "X: " + g.x + ", Z: " + g.z + " | Chunk: " + cx + ", " + cz;
    });

    function gameToLatLng(gx, gz) {
      return [-(gz / SCALE), gx / SCALE];
    }

    function latLngToGame(latlng) {
      return { x: Math.round(latlng.lng * SCALE), z: Math.round(-latlng.lat * SCALE) };
    }

    function gotoCoords() {
      var x = parseInt(document.getElementById("goto-x").value);
      var z = parseInt(document.getElementById("goto-z").value);
      if (isNaN(x) || isNaN(z)) return;
      map.setView(gameToLatLng(x, z), Math.max(map.getZoom(), -3));
    }

    document.getElementById("goto-x").addEventListener("keydown", function(e) {
      if (e.key === "Enter") gotoCoords();
    });
    document.getElementById("goto-z").addEventListener("keydown", function(e) {
      if (e.key === "Enter") gotoCoords();
    });

    function togglePanel() {
      var p = document.getElementById("panel");
      var a = document.getElementById("panel-arrow");
      p.classList.toggle("collapsed");
      a.textContent = p.classList.contains("collapsed") ? "◀" : "▶";
    }

    function toggleLeftPanel() {
      var p = document.getElementById("left-panel");
      var a = document.getElementById("left-panel-arrow");
      p.classList.toggle("collapsed");
      a.textContent = p.classList.contains("collapsed") ? "▶" : "▼";
    }

    var waypoints = JSON.parse(localStorage.getItem("factions_waypoints") || "[]");
    var wpMarkers = {};
    var addMode = false;
    var pendingCoords = null;
    var wpColors = ["#22c55e", "#ef4444", "#3b82f6", "#eab308", "#a855f7", "#f97316", "#06b6d4", "#ec4899"];
    var selectedColor = wpColors[0];

    function initColorRow() {
      var row = document.getElementById("color-row");
      row.innerHTML = "";
      wpColors.forEach(function(c) {
        var s = document.createElement("div");
        s.className = "color-swatch" + (c === selectedColor ? " sel" : "");
        s.style.background = c;
        s.onclick = function() {
          selectedColor = c;
          row.querySelectorAll(".color-swatch").forEach(function(el) { el.classList.remove("sel"); });
          s.classList.add("sel");
        };
        row.appendChild(s);
      });
    }

    function makeIcon(color) {
      return L.divIcon({
        className: "wp-marker",
        html: '<svg width="24" height="34" viewBox="0 0 24 34"><path d="M12 0C5.4 0 0 5.4 0 12c0 9 12 22 12 22s12-13 12-22C24 5.4 18.6 0 12 0z" fill="' + color + '"/><circle cx="12" cy="11" r="5" fill="rgba(0,0,0,0.3)"/></svg>',
        iconSize: [24, 34],
        iconAnchor: [12, 34],
        popupAnchor: [0, -34]
      });
    }

    function renderWaypoints() {
      Object.keys(wpMarkers).forEach(function(id) {
        map.removeLayer(wpMarkers[id]);
      });
      wpMarkers = {};

      var list = document.getElementById("wp-list");
      if (!waypoints.length) {
        list.innerHTML = '';
        return;
      }
      list.innerHTML = "";
      waypoints.forEach(function(wp, i) {
        var ll = gameToLatLng(wp.x, wp.z);
        var marker = L.marker(ll, { icon: makeIcon(wp.color) }).addTo(map);
        marker.bindPopup('<b style="color:' + wp.color + '">' + wp.name + '</b><br>X: ' + wp.x + ' Z: ' + wp.z);
        wpMarkers[i] = marker;

        var item = document.createElement("div");
        item.className = "wp-item";
        item.onclick = function() { map.setView(ll, Math.max(map.getZoom(), -2)); };
        item.innerHTML = '<div class="wp-dot" style="background:' + wp.color + '"></div>' +
          '<div class="wp-info"><div class="wp-name">' + wp.name + '</div><div class="wp-coords">X: ' + wp.x + '  Z: ' + wp.z + '</div></div>' +
          '<button class="wp-del" data-idx="' + i + '">&#10005;</button>';
        item.querySelector(".wp-del").onclick = function(e) {
          e.stopPropagation();
          waypoints.splice(i, 1);
          localStorage.setItem("factions_waypoints", JSON.stringify(waypoints));
          renderWaypoints();
        };
        list.appendChild(item);
      });
    }

    function toggleAddMode() {
      addMode = !addMode;
      var btn = document.getElementById("wp-add-btn");
      if (addMode) {
        btn.textContent = "Click map to place...";
        btn.classList.add("active");
        document.body.classList.add("crosshair-cursor");
      } else {
        btn.textContent = "+ Add Waypoint";
        btn.classList.remove("active");
        document.body.classList.remove("crosshair-cursor");
      }
    }

    map.on("click", function(e) {
      if (!addMode) return;
      var g = latLngToGame(e.latlng);
      var gx = g.x;
      var gz = g.z;
      pendingCoords = { x: gx, z: gz };
      selectedColor = wpColors[0];
      initColorRow();
      document.getElementById("wp-name").value = "";
      document.getElementById("form-coords").textContent = "X: " + gx + ", Z: " + gz;
      document.getElementById("wp-form-overlay").classList.add("show");
      setTimeout(function() { document.getElementById("wp-name").focus(); }, 100);
      toggleAddMode();
    });

    function cancelWaypoint() {
      document.getElementById("wp-form-overlay").classList.remove("show");
      pendingCoords = null;
    }

    function saveWaypoint() {
      var name = document.getElementById("wp-name").value.trim();
      if (!name || !pendingCoords) return;
      waypoints.push({
        name: name,
        x: pendingCoords.x,
        z: pendingCoords.z,
        color: selectedColor
      });
      localStorage.setItem("factions_waypoints", JSON.stringify(waypoints));
      document.getElementById("wp-form-overlay").classList.remove("show");
      pendingCoords = null;
      renderWaypoints();
    }

    document.getElementById("wp-name").addEventListener("keydown", function(e) {
      if (e.key === "Enter") saveWaypoint();
      if (e.key === "Escape") cancelWaypoint();
    });

    document.getElementById("wp-form-overlay").addEventListener("click", function(e) {
      if (e.target === this) cancelWaypoint();
    });

    renderWaypoints();

    var PLAYERS_API = "https://api.wolver002.com/map/players";
    var trackingTargets = {};
    var trackTrails = {};
    var trackMarkers = {};
    var pendingTrackPlayer = null;
    var livePlayerMarkers = {};

    function makeSkinIcon(skinId, name) {
      var faceUrl = skinId
        ? "https://crafatar.com/avatars/" + skinId + "?size=32&overlay"
        : "https://crafatar.com/avatars/8667ba71-b85a-4004-af54-457a9734eed7?size=32&overlay";
      return L.divIcon({
        className: "",
        html: '<div style="text-align:center;white-space:nowrap">' +
              '<img src="' + faceUrl + '" width="24" height="24" style="display:block;margin:0 auto;border:2px solid #fff;border-radius:3px;image-rendering:pixelated"/>' +
              '<span style="font-size:10px;background:rgba(0,0,0,0.7);color:#fff;padding:1px 4px;border-radius:3px;margin-top:2px;display:inline-block">' + name + '</span>' +
              '</div>',
        iconSize: [60, 44],
        iconAnchor: [30, 12],
        popupAnchor: [0, -12]
      });
    }

    function fetchOnlinePlayers() {
      fetch(PLAYERS_API)
        .then(function(r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(function(d) {
          var list = document.getElementById("track-player-list");
          var players = (d.players || []);
          if (!players.length) {
            list.innerHTML = '<div style="font-size:11px;color:#555;padding:4px 0">No players online</div>';
            Object.keys(livePlayerMarkers).forEach(function(n) { map.removeLayer(livePlayerMarkers[n]); });
            livePlayerMarkers = {};
            return;
          }

          // Update left panel
          list.innerHTML = "";
          var seen = {};
          players.forEach(function(p) {
            var name = p.Username;
            var pos = p.Pose && p.Pose.Head && p.Pose.Head.Position;
            var gx = pos ? Math.round(pos[0]) : "?";
            var gz = pos ? Math.round(pos[2]) : "?";
            seen[name] = true;

            var item = document.createElement("div");
            item.className = "track-player-item";
            item.style.flexDirection = "column";
            item.style.alignItems = "flex-start";
            item.style.paddingBottom = "6px";
            item.innerHTML =
              '<div style="display:flex;align-items:center;gap:6px">' +
                '<div class="dot-on"></div>' +
                '<span style="font-weight:600">' + name + '</span>' +
              '</div>' +
              '<div style="font-size:10px;color:var(--muted);padding-left:12px">X: ' + gx + '  Z: ' + gz + ' &nbsp;·&nbsp; ' + (p.PlayTime || "") + '</div>';
            if (pos) {
              item.style.cursor = "pointer";
              item.onclick = (function(x, z) {
                return function() { map.setView(gameToLatLng(x, z), Math.max(map.getZoom(), -2)); };
              })(Math.round(pos[0]), Math.round(pos[2]));
            }
            list.appendChild(item);

            // Place/update marker on map
            if (pos) {
              var ll = gameToLatLng(Math.round(pos[0]), Math.round(pos[2]));
              if (livePlayerMarkers[name]) {
                livePlayerMarkers[name].setLatLng(ll);
              } else {
                livePlayerMarkers[name] = L.marker(ll, { icon: makeSkinIcon(p.SkinId, name), zIndexOffset: 500 })
                  .addTo(map)
                  .bindPopup('<b>' + name + '</b><br>X: ' + Math.round(pos[0]) + '  Z: ' + Math.round(pos[2]) + '<br>Ping: ' + Math.round(p.ping || 0) + 'ms');
              }
            }
          });

          // Remove markers for players who logged off
          Object.keys(livePlayerMarkers).forEach(function(n) {
            if (!seen[n]) { map.removeLayer(livePlayerMarkers[n]); delete livePlayerMarkers[n]; }
          });
        })
        .catch(function() {
          var list = document.getElementById("track-player-list");
          list.innerHTML = '<div style="font-size:11px;color:var(--red);padding:4px 0">Server offline</div>';
        });
    }

    function openTrackForm(name) {
      pendingTrackPlayer = name;
      document.getElementById("track-player-label").textContent = name;
      document.getElementById("track-interval").value = "3";
      document.getElementById("track-form-overlay").classList.add("show");
    }

    function cancelTrack() {
      document.getElementById("track-form-overlay").classList.remove("show");
      pendingTrackPlayer = null;
    }

    function startTrack() {
      if (!pendingTrackPlayer) return;
      var interval = parseInt(document.getElementById("track-interval").value) || 3;
      if (interval < 1) interval = 1;
      if (interval > 60) interval = 60;
      var name = pendingTrackPlayer;
      document.getElementById("track-form-overlay").classList.remove("show");
      pendingTrackPlayer = null;

      var colors = ["#3b82f6", "#f97316", "#a855f7", "#06b6d4", "#ec4899", "#eab308"];
      var colorIdx = Object.keys(trackingTargets).length % colors.length;
      var color = colors[colorIdx];

      trackTrails[name] = [];
      trackMarkers[name] = { trail: null, dot: null, color: color };

      var tid = setInterval(function() { pollPlayerPos(name); }, interval * 1000);
      trackingTargets[name] = { interval: interval, timer: tid, color: color };

      pollPlayerPos(name);
      renderActiveTracking();
      fetchOnlinePlayers();
    }

    function pollPlayerPos(name) {
      fetch(PLAYERS_API)
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var players = d.players || [];
          var p = players.find(function(pl) { return pl.Username === name; });
          if (!p || !p.Pose || !p.Pose.Head) return;
          var pos = p.Pose.Head.Position;
          var point = { x: Math.round(pos[0]), z: Math.round(pos[2]), t: Date.now() / 1000 };
          var trail = trackTrails[name];
          if (trail.length > 0) {
            var last = trail[trail.length - 1];
            if (last.x === point.x && last.z === point.z) return;
          }
          trail.push(point);
          if (trail.length > 500) trail.shift();
          drawTrail(name);
        })
        .catch(function() {});
    }

    function drawTrail(name) {
      var m = trackMarkers[name];
      var trail = trackTrails[name];
      if (!m || !trail.length) return;

      if (m.trail) map.removeLayer(m.trail);
      if (m.dot) map.removeLayer(m.dot);

      var latlngs = trail.map(function(p) { return gameToLatLng(p.x, p.z); });
      m.trail = L.polyline(latlngs, { color: m.color, weight: 3, opacity: 0.7, dashArray: "6 4" }).addTo(map);

      var latest = trail[trail.length - 1];
      var ll = gameToLatLng(latest.x, latest.z);
      m.dot = L.circleMarker(ll, {
        radius: 7,
        fillColor: m.color,
        fillOpacity: 1,
        color: "#fff",
        weight: 2
      }).addTo(map);
      m.dot.bindPopup('<b style="color:' + m.color + '">' + name + '</b><br>X: ' + latest.x + ' Z: ' + latest.z);
    }

    function stopTrack(name) {
      if (trackingTargets[name]) {
        clearInterval(trackingTargets[name].timer);
        delete trackingTargets[name];
      }
      if (trackMarkers[name]) {
        if (trackMarkers[name].trail) map.removeLayer(trackMarkers[name].trail);
        if (trackMarkers[name].dot) map.removeLayer(trackMarkers[name].dot);
        delete trackMarkers[name];
      }
      delete trackTrails[name];
      renderActiveTracking();
      fetchOnlinePlayers();
    }

    function renderActiveTracking() {
      var container = document.getElementById("track-active");
      var names = Object.keys(trackingTargets);
      if (!names.length) {
        container.innerHTML = "";
        container.style.display = "none";
        return;
      }
      container.style.display = "";
      container.innerHTML = '<label style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:4px;display:block">Active</label>';
      names.forEach(function(name) {
        var t = trackingTargets[name];
        var item = document.createElement("div");
        item.className = "track-active-item";
        item.innerHTML = '<span class="track-name" style="color:' + t.color + '">' + name + '</span>' +
          '<span class="track-info">' + t.interval + 's</span>' +
          '<button class="track-stop" onclick="stopTrack(\'' + name.replace(/'/g, "\\'") + '\')">&#10005;</button>';
        container.appendChild(item);
      });
    }

    document.getElementById("track-form-overlay").addEventListener("click", function(e) {
      if (e.target === this) cancelTrack();
    });

    document.getElementById("track-interval").addEventListener("keydown", function(e) {
      if (e.key === "Enter") startTrack();
      if (e.key === "Escape") cancelTrack();
    });

    fetchOnlinePlayers();
    setInterval(fetchOnlinePlayers, 2000);
    renderActiveTracking();

    // Zoom slider
    var zoomSlider = document.getElementById("zoom-slider");
    var zoomVal = document.getElementById("zoom-val");
    zoomSlider.addEventListener("input", function() {
      map.setZoom(parseInt(this.value));
      zoomVal.textContent = this.value;
    });
    map.on("zoomend", function() {
      var z = map.getZoom();
      zoomSlider.value = z;
      zoomVal.textContent = z;
    });
  </script>
</body>
</html>
