<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FactionsVR · wolver002</title>
  <link rel="icon" href="/wfm/favicon.png" />
  <style>
    @font-face{font-family:MC;src:url('/wfm/Minecraft.otf');font-weight:normal}
    @font-face{font-family:MC;src:url('/wfm/Minecraft-Bold.otf');font-weight:bold}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:MC,monospace;color:#e8e8e8;min-height:100vh;-webkit-font-smoothing:none;font-smooth:never;
      background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),url('/wfm/dirt.png');
      background-size:auto,48px 48px;image-rendering:pixelated}
    main{max-width:900px;margin:0 auto;padding:48px 22px 72px}
    .back{display:inline-block;color:#bdbdbd;text-decoration:none;font-size:14px;margin-bottom:28px;text-shadow:1px 1px #000}
    .back:hover{color:#ffd98a}
    h1{font-size:clamp(24px,4.5vw,40px);color:#fff;font-weight:bold;text-shadow:3px 3px #3e3e3e;margin:0 0 26px;line-height:1.2}
    .features-heading{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#ffd98a;
      text-shadow:1px 1px #000;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid #444}
    .features{list-style:none;margin:0 0 30px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
    .features li{color:#e8e8e8;font-size:15px;text-shadow:1px 1px #000;
      background:rgba(0,0,0,.5);border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;padding:8px 12px}
    .features li::before{content:"\25AA";color:#5aff5a;margin-right:9px}
    .switcher{display:flex;gap:8px;margin-bottom:14px}
    .switcher button{font-family:MC,monospace;font-size:14px;color:#fff;text-shadow:1px 1px #3e3e3e;cursor:pointer;
      background:#6d6d6d;border:2px solid;border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;
      padding:6px 15px 8px;transition:background .1s,border-color .1s}
    .switcher button:hover:not(.active){background:#7c81b8;border-color:#b6bae6 #43436e #43436e #b6bae6}
    .switcher button.active{background:#3a7a3a;border-color:#6fb06f #204020 #204020 #6fb06f}
    .video-wrap{background:#000;border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;overflow:hidden}
    .video-wrap video{display:block;width:100%;height:auto;max-height:80vh}
    .credit{color:#8f8f8f;font-size:13px;text-shadow:1px 1px #000;margin-top:12px}
  </style>
</head>
<body>
  <main>
    <a class="back" href="/moding">&larr; back</a>
    <h1>Old Factions Mod ft. imgui Menu</h1>

    <p class="features-heading">Features</p>
    <ul class="features">
      <li>Fly</li>
      <li>Tp Cords</li>
      <li>Insta Break</li>
      <li>Multibreak</li>
      <li>Coordinate Break</li>
      <li>1 Hit Kill</li>
    </ul>

    <div class="switcher">
      <button class="active" onclick="switchVideo(0)">Clip 1</button>
      <button onclick="switchVideo(1)">Clip 2</button>
    </div>

    <div class="video-wrap">
      <video id="player" controls preload="metadata" playsinline>
        <source src="/videos/factionsvr.mp4" type="video/mp4" />
      </video>
    </div>
    <p class="credit" id="credit"></p>
  </main>
  <script>
    var sources = ["/videos/factionsvr.mp4", "/videos/factionsvr2.mp4"];
    var credits = ["", "Clip by Jonny Jonny"];
    function switchVideo(i) {
      var v = document.getElementById("player");
      var btns = document.querySelectorAll(".switcher button");
      btns.forEach(function(b, idx) { b.classList.toggle("active", idx === i); });
      v.src = sources[i];
      v.load();
      document.getElementById("credit").textContent = credits[i];
    }
  </script>
</body>
</html>
