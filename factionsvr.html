<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FactionsVR · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--fg); }
    h1 {
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.02em;
      margin: 0 0 28px;
      font-weight: 600;
    }
    .video-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .video-wrap video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
    }
    .features-heading {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 10px;
      color: var(--fg);
    }
    .features {
      list-style: disc;
      padding-left: 22px;
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }
    .switcher {
      display: flex;
      gap: 0;
      margin-bottom: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      width: fit-content;
    }
    .switcher button {
      padding: 8px 18px;
      background: var(--card);
      border: none;
      color: var(--muted);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease;
    }
    .switcher button:not(:last-child) {
      border-right: 1px solid var(--line);
    }
    .switcher button.active {
      background: #1f1f23;
      color: var(--fg);
    }
    .switcher button:hover:not(.active) {
      background: #131318;
    }
    .credit {
      color: var(--muted);
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/moding">← back</a>
    <h1>Old Factions Mod ft.imgui Menu</h1>

    <p class="features-heading">Features:</p>
    <ul class="features">
      <li>Fly</li>
      <li>Tp Cords</li>
      <li>Insta Break</li>
      <li>Multibreak</li>
      <li>Coordinate Break</li>
      <li>1 Hit Kill</li>
    </ul>

    <div class="switcher">
      <button class="active" onclick="switchVideo(0)">Clip 1</button>
      <button onclick="switchVideo(1)">Clip 2</button>
    </div>

    <div class="video-wrap">
      <video id="player" controls preload="metadata" playsinline>
        <source src="/videos/factionsvr.mp4" type="video/mp4" />
      </video>
    </div>
    <p class="credit" id="credit"></p>
  </main>
  <script>
    var sources = ["/videos/factionsvr.mp4", "/videos/factionsvr2.mp4"];
    var credits = ["", "Clip by Jonny Jonny"];
    function switchVideo(i) {
      var v = document.getElementById("player");
      var btns = document.querySelectorAll(".switcher button");
      btns.forEach(function(b, idx) { b.classList.toggle("active", idx === i); });
      v.src = sources[i];
      v.load();
      document.getElementById("credit").textContent = credits[i];
    }
  </script>
</body>
</html>
