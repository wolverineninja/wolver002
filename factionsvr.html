<!doctype html>

  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {

      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--fg); }
    h1 {
      font-size: clamp(28px, 4vw, 40px);
      letter-spacing: -0.02em;
      margin: 0 0 28px;
      font-weight: 600;
    }
    .video-wrap {
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .video-wrap video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 80vh;
    }
