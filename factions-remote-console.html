<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Console · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
      --green: #22c55e;
      --red: #ef4444;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, monospace;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 1060px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .main-row {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 12px;
      align-items: stretch;
    }
    @media (max-width: 768px) {
      .main-row { grid-template-columns: 1fr; }
    }
    .chat-panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .chat-panel .chat-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .chat-panel .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.7;
    }
    .chat-panel .chat-input-row {
      display: flex;
      border-top: 1px solid var(--line);
    }
    .chat-panel .chat-input-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
    }
    .chat-panel .chat-input-row input::placeholder { color: #444; }
    .chat-panel .chat-input-row button {
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-left: 1px solid var(--line);
      color: var(--accent);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .chat-panel .chat-input-row button:hover { background: #1a1a1e; }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--fg); }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      font-weight: 600;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .console {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .console-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .log {
      height: 320px;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
    }
    .log .entry { color: var(--muted); }
    .log .entry.sent { color: var(--accent); }
    .log .entry.error { color: var(--red); }
    .log .entry .time { color: #555; margin-right: 8px; }
    .input-row {
      display: flex;
      border-top: 1px solid var(--line);
    }
    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      padding: 14px 16px;
      outline: none;
    }
    .input-row input::placeholder { color: #444; }
    .input-row button {
      padding: 14px 24px;
      background: transparent;
      border: none;
      border-left: 1px solid var(--line);
      color: var(--accent);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 120ms;
    }
    .input-row button:hover { background: #1a1a1e; }
    .mic-btn { color: var(--muted); }
    .mic-btn.active {
      color: var(--red);
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .jarvis-bar {
      display: none;
      padding: 8px 16px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      background: rgba(239,68,68,0.05);
    }
    .jarvis-bar.show { display: flex; align-items: center; gap: 8px; }
    .jarvis-bar .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      animation: pulse 1.5s infinite;
    }
    .popup-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .popup-overlay.show { display: flex; }
    .popup-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 40px 48px;
      max-width: 520px;
      text-align: center;
      animation: popIn 0.25s ease;
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .popup-box .popup-msg {
      font-size: 22px;
      font-weight: 600;
      font-family: ui-sans-serif, system-ui, sans-serif;
      margin-bottom: 8px;
    }
    .popup-box .popup-sub {
      color: var(--muted);
      font-size: 13px;
    }
    .timer-bar {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 90;
      text-align: center;
      padding: 10px;
      background: #111114ee;
      border-bottom: 1px solid var(--line);
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    }
    .timer-bar.show { display: block; }
    .timer-bar .timer-time {
      font-size: 28px;
      color: #eab308;
      font-weight: 700;
    }
    .timer-bar .timer-label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }
    .auth-btn {
      position: fixed;
      top: 16px;
      right: 24px;
      z-index: 150;
      padding: 8px 18px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-btn:hover { border-color: #333; }
    .auth-btn .uname { color: var(--green); }
    .auth-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 160;
      justify-content: center;
      align-items: center;
    }
    .auth-modal.show { display: flex; }
    .auth-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 32px 36px;
      width: 320px;
      text-align: center;
    }
    .auth-box h2 { font-size: 18px; margin-bottom: 18px; font-weight: 600; font-family: ui-sans-serif, system-ui, sans-serif; }
    .auth-box input {
      width: 100%;
      margin-bottom: 10px;
      text-align: center;
      font-size: 14px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--fg);
      padding: 10px;
      font-family: inherit;
      outline: none;
    }
    .auth-box input:focus { border-color: #333; }
    .auth-btns { display: flex; gap: 8px; margin-top: 14px; }
    .auth-btns button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .auth-btns .btn-su { background: #222; color: var(--fg); }
    .auth-btns .btn-su:hover { background: #2a2a2a; }
    .auth-btns .btn-li { background: var(--green); color: #000; }
    .auth-btns .btn-li:hover { opacity: 0.85; }
    .auth-err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
  </style>
</head>
<body>
  <main>
    <button class="auth-btn" id="auth-btn" onclick="openAuth()">Log In</button>

    <div class="auth-modal" id="auth-modal">
      <div class="auth-box">
        <h2>Log In</h2>
        <input type="text" id="auth-user" placeholder="Username" autocomplete="off" />
        <input type="password" id="auth-pass" placeholder="Password" autocomplete="off" />
        <div class="auth-btns">
          <button class="btn-su" onclick="doSignup()">Sign Up</button>
          <button class="btn-li" onclick="doLogin()">Log In</button>
        </div>
        <div class="auth-err" id="auth-err"></div>
      </div>
    </div>

    <a class="back" href="/moding">&#8592; back</a>
    <h1 style="font-family: ui-sans-serif, system-ui, sans-serif;">Factions Remote Console</h1>
    <a href="https://discord.gg/Nb6UQsGhUW" target="_blank" style="display:inline-block;margin-bottom:16px;color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);padding:6px 14px;border-radius:8px;">Join the Discord</a>


    <div class="main-row">
      <div class="console">
        <div class="console-header">
          <span>console</span>
          <span id="count">0 commands sent</span>
        </div>
        <div class="log" id="log">
          <div class="entry"><span class="time">--:--</span>Ready. Type a command below.</div>
        </div>
        <div class="input-row">
          <input type="text" id="cmd" placeholder="/help" autocomplete="off" spellcheck="false" />
          <button onclick="sendCmd()">send</button>
          <button class="mic-btn" id="mic-btn" onclick="toggleJarvis()" title="Jarvis Mode">&#127908;</button>
        </div>
        <div class="jarvis-bar" id="jarvis-bar">
          <span class="dot"></span>
          <span id="jarvis-status">Listening...</span>
        </div>
      </div>
      <div class="chat-panel">
        <div class="chat-head">chat</div>
        <div class="chat-msgs" id="chat-box">
          <div style="color:var(--muted);font-size:12px;padding:8px">No messages yet</div>
        </div>
        <div class="chat-input-row">
          <input type="text" id="chat-input" placeholder="Message..." autocomplete="off" />
          <button onclick="sendChat()">send</button>
        </div>
      </div>
    </div>
    <div style="margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px">
      <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px;font-weight:600">
        Online <span id="online-count" style="color:var(--accent)"></span>
      </div>
      <div id="online-list" style="font-size:13px;color:var(--fg);min-height:20px">-</div>
    </div>
    <div id="bl-section" style="display:none;margin-top:8px;font-size:12px;color:var(--muted)">
      <strong style="color:var(--red)">Blocked commands:</strong>
      <span id="bl-list"></span>
    </div>
  </main>

  <div class="popup-overlay" id="popup">
    <div class="popup-box">
      <div class="popup-msg" id="popup-msg"></div>
      <div class="popup-sub">from admin</div>
    </div>
  </div>
  <div class="timer-bar" id="timerbar">
    <div class="timer-time" id="timer-time">00:00</div>
    <div class="timer-label" id="timer-label"></div>
  </div>

  <script>
    var SERVER = "https://admin.wolver002.com";
    var count = 0;
    var input = document.getElementById("cmd");
    var log = document.getElementById("log");
    var lastPopupId = 0;
    var popupTimeout = null;
    var audioCtx = null;
    var userToken = localStorage.getItem("rc_user_token") || "";
    var userName = localStorage.getItem("rc_user_name") || "";

    function getUsername() {
      return userName || "";
    }

    function updateAuthBtn() {
      var btn = document.getElementById("auth-btn");
      if (userToken && userName) {
        btn.innerHTML = '<span class="uname">' + userName + '</span> &#8226; Log Out';
        btn.onclick = doLogout;
      } else {
        btn.innerHTML = 'Log In';
        btn.onclick = openAuth;
      }
    }

    function openAuth() {
      document.getElementById("auth-err").textContent = "";
      document.getElementById("auth-user").value = "";
      document.getElementById("auth-pass").value = "";
      document.getElementById("auth-modal").classList.add("show");
      setTimeout(function() { document.getElementById("auth-user").focus(); }, 100);
    }

    function closeAuth() {
      document.getElementById("auth-modal").classList.remove("show");
    }

    function doLogin() {
      var u = document.getElementById("auth-user").value.trim();
      var p = document.getElementById("auth-pass").value;
      if (!u || !p) { document.getElementById("auth-err").textContent = "Fill in both fields"; return; }
      fetch(SERVER + "/account/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.error) { document.getElementById("auth-err").textContent = d.error; return; }
        userToken = d.token;
        userName = d.username;
        localStorage.setItem("rc_user_token", userToken);
        localStorage.setItem("rc_user_name", userName);
        closeAuth();
        updateAuthBtn();
        addLog("Logged in as " + userName, "sent");
      }).catch(function() { document.getElementById("auth-err").textContent = "Server offline"; });
    }

    function doSignup() {
      var u = document.getElementById("auth-user").value.trim();
      var p = document.getElementById("auth-pass").value;
      if (!u || !p) { document.getElementById("auth-err").textContent = "Fill in both fields"; return; }
      fetch(SERVER + "/account/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username: u, password: p })
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.error) { document.getElementById("auth-err").textContent = d.error; return; }
        userToken = d.token;
        userName = d.username;
        localStorage.setItem("rc_user_token", userToken);
        localStorage.setItem("rc_user_name", userName);
        closeAuth();
        updateAuthBtn();
        addLog("Account created: " + userName, "sent");
      }).catch(function() { document.getElementById("auth-err").textContent = "Server offline"; });
    }

    function doLogout() {
      userToken = "";
      userName = "";
      localStorage.removeItem("rc_user_token");
      localStorage.removeItem("rc_user_name");
      updateAuthBtn();
      addLog("Logged out", "");
    }

    document.getElementById("auth-modal").addEventListener("click", function(e) {
      if (e.target === this) closeAuth();
    });
    document.getElementById("auth-pass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });

    updateAuthBtn();

    var themes = {
      default: { bg: "#0b0b0c", fg: "#e8e8ea", muted: "#8a8a92", line: "#1f1f23", card: "#111114", accent: "#22c55e" },
      red:     { bg: "#0c0808", fg: "#e8e8ea", muted: "#8a8a92", line: "#231f1f", card: "#141111", accent: "#ef4444" },
      blue:    { bg: "#080a0c", fg: "#e8e8ea", muted: "#8a8a92", line: "#1f2123", card: "#111214", accent: "#3b82f6" },
      green:   { bg: "#080c08", fg: "#e8e8ea", muted: "#8a8a92", line: "#1f231f", card: "#111411", accent: "#22c55e" },
      light:   { bg: "#f0f0f2", fg: "#1a1a1e", muted: "#6a6a72", line: "#d0d0d4", card: "#ffffff", accent: "#22c55e" }
    };

    function applyTheme(name) {
      var t = themes[name] || themes.default;
      var r = document.documentElement.style;
      r.setProperty("--bg", t.bg);
      r.setProperty("--fg", t.fg);
      r.setProperty("--muted", t.muted);
      r.setProperty("--line", t.line);
      r.setProperty("--card", t.card);
      r.setProperty("--accent", t.accent);
    }

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playSound(type) {
      if (!type) return;
      try {
        var ctx = getAudioCtx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.value = 0.25;

        if (type === "ping") {
          osc.frequency.value = 880;
          osc.type = "sine";
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === "alert") {
          osc.frequency.value = 660;
          osc.type = "square";
          gain.gain.value = 0.15;
          osc.start();
          osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
          osc.stop(ctx.currentTime + 0.35);
        } else if (type === "horn") {
          osc.frequency.value = 180;
          osc.type = "sawtooth";
          gain.gain.value = 0.2;
          osc.start();
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
          osc.stop(ctx.currentTime + 0.8);
        }
      } catch(e) {}
    }

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendCmd();
    });

    function ts() {
      var d = new Date();
      return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
    }

    function addLog(msg, cls) {
      var div = document.createElement("div");
      div.className = "entry " + (cls || "");
      div.innerHTML = '<span class="time">' + ts() + "</span>" + msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function sendCmd() {
      var cmd = input.value.trim();
      if (!cmd) return;
      input.value = "";
      ensureClaimed(function() {
        fetch(SERVER, {
          method: "POST",
          body: cmd,
          headers: { "X-Username": getUsername(), "X-User-Token": userToken }
        }).then(function(r) {
          if (r.ok) {
            count++;
            document.getElementById("count").textContent = count + " command" + (count === 1 ? "" : "s") + " sent";
            addLog("$ " + cmd, "sent");
          } else if (r.status === 403) {
            r.json().then(function(d) {
              addLog(d.error || "Command blocked by admin", "error");
            }).catch(function() { addLog("Command blocked by admin", "error"); });
          } else {
            addLog("Failed to send: " + cmd, "error");
          }
        }).catch(function() {
          addLog("Server offline", "error");
        });
      });
    }

    function showPopup(msg) {
      document.getElementById("popup-msg").textContent = msg;
      document.getElementById("popup").classList.add("show");
      if (popupTimeout) clearTimeout(popupTimeout);
      popupTimeout = setTimeout(function() {
        document.getElementById("popup").classList.remove("show");
      }, 6000);
    }

    document.getElementById("popup").addEventListener("click", function() {
      this.classList.remove("show");
    });

    function pollAdmin() {
      fetch(SERVER + "/poll", { headers: { "X-Username": getUsername() } }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.popup && data.popup_id > lastPopupId) {
          lastPopupId = data.popup_id;
          showPopup(data.popup);
          playSound(data.popup_sound);
        }
        var bar = document.getElementById("timerbar");
        if (data.timer > 0) {
          bar.classList.add("show");
          var m = Math.floor(data.timer / 60);
          var s = data.timer % 60;
          document.getElementById("timer-time").textContent =
            m.toString().padStart(2,"0") + ":" + s.toString().padStart(2,"0");
          document.getElementById("timer-label").textContent = data.timer_label || "";
        } else {
          bar.classList.remove("show");
        }
        if (data.theme) applyTheme(data.theme);
        if (data.blacklist && data.blacklist.length) {
          document.getElementById("bl-section").style.display = "block";
          document.getElementById("bl-list").textContent = data.blacklist.join(", ");
        } else {
          document.getElementById("bl-section").style.display = "none";
        }
        var ol = document.getElementById("online-list");
        var oc = document.getElementById("online-count");
        if (data.online && data.online.length) {
          oc.textContent = "(" + data.online.length + ")";
          ol.innerHTML = data.online.map(function(n) {
            return '<div style="padding:3px 0"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px"></span>' + n + '</div>';
          }).join("");
        } else {
          oc.textContent = "";
          ol.innerHTML = '<div style="color:var(--muted);font-size:12px">No one online</div>';
        }
        if (data.chat) renderViewerChat(data.chat);
      }).catch(function() {});
    }

    document.getElementById("chat-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendChat();
    });

    function ensureClaimed(callback) {
      if (userToken && userName) { callback(); return; }
      addLog("Log in first (button top-right)", "error");
    }

    function sendChat() {
      var msg = document.getElementById("chat-input").value.trim();
      if (!msg) return;
      document.getElementById("chat-input").value = "";
      ensureClaimed(function() {
        fetch(SERVER + "/chat", {
          method: "POST",
          body: JSON.stringify({ message: msg }),
          headers: { "Content-Type": "application/json", "X-User-Token": userToken }
        }).then(function(r) {
          if (!r.ok) r.json().then(function(d) { addLog(d.error || "Chat failed", "error"); });
        }).catch(function() { addLog("Server offline", "error"); });
      });
    }

    function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

    function renderViewerChat(list) {
      var el = document.getElementById("chat-box");
      el.innerHTML = "";
      list.forEach(function(m) {
        var div = document.createElement("div");
        var isAdmin = m.name === "Admin";
        div.style.cssText = "padding:2px 0";
        div.innerHTML = '<span style="color:#555;margin-right:6px">' + esc(m.time) + '</span><strong style="color:' + (isAdmin ? "#eab308" : "var(--accent)") + '">' + esc(m.name) + ':</strong> ' + esc(m.message);
        el.appendChild(div);
      });
      if (!list.length) el.innerHTML = '<div style="color:var(--muted);font-size:12px;padding:8px">No messages yet</div>';
      el.scrollTop = el.scrollHeight;
    }

    setInterval(pollAdmin, 2000);
    pollAdmin();

    var jarvisOn = false;
    var recognition = null;
    var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    var useServerTranscribe = !SpeechRec;
    var micStream = null;
    var audioProcessor = null;
    var audioChunks = [];
    var recCtx = null;

    function sendVoiceCmd(text) {
      var cmd = text.trim();
      if (!cmd) return;
      if (!cmd.startsWith("/")) cmd = "/" + cmd.replace(/\s+/g, "_");
      addLog("$ " + cmd + " (voice)", "sent");
      fetch(SERVER, { method: "POST", body: cmd, headers: { "X-Username": getUsername(), "X-User-Token": userToken } }).then(function(r) {
        if (r.ok) {
          count++;
          document.getElementById("count").textContent = count + " command" + (count === 1 ? "" : "s") + " sent";
        } else if (r.status === 403) {
          r.json().then(function(d) {
            addLog(d.error || "Command blocked by admin", "error");
          }).catch(function() { addLog("Command blocked", "error"); });
        }
      }).catch(function() { addLog("Server offline", "error"); });
    }

    function buildWav(samples, sampleRate) {
      var len = samples.length;
      var buf = new ArrayBuffer(44 + len * 2);
      var v = new DataView(buf);
      var s = "RIFF";
      for (var i = 0; i < 4; i++) v.setUint8(i, s.charCodeAt(i));
      v.setUint32(4, 36 + len * 2, true);
      s = "WAVE";
      for (var i = 0; i < 4; i++) v.setUint8(8 + i, s.charCodeAt(i));
      s = "fmt ";
      for (var i = 0; i < 4; i++) v.setUint8(12 + i, s.charCodeAt(i));
      v.setUint32(16, 16, true);
      v.setUint16(20, 1, true);
      v.setUint16(22, 1, true);
      v.setUint32(24, sampleRate, true);
      v.setUint32(28, sampleRate * 2, true);
      v.setUint16(32, 2, true);
      v.setUint16(34, 16, true);
      s = "data";
      for (var i = 0; i < 4; i++) v.setUint8(36 + i, s.charCodeAt(i));
      v.setUint32(40, len * 2, true);
      for (var i = 0; i < len; i++) {
        v.setInt16(44 + i * 2, samples[i], true);
      }
      return new Blob([buf], { type: "audio/wav" });
    }

    function toggleJarvis() {
      if (useServerTranscribe) {
        toggleRecording();
      } else {
        toggleWebSpeech();
      }
    }

    function toggleWebSpeech() {
      jarvisOn = !jarvisOn;
      var btn = document.getElementById("mic-btn");
      var bar = document.getElementById("jarvis-bar");
      if (jarvisOn) {
        btn.classList.add("active");
        bar.classList.add("show");
        startListening();
        addLog("Jarvis mode ON", "sent");
      } else {
        btn.classList.remove("active");
        bar.classList.remove("show");
        if (recognition) recognition.stop();
        addLog("Jarvis mode OFF", "");
      }
    }

    function toggleRecording() {
      var btn = document.getElementById("mic-btn");
      var bar = document.getElementById("jarvis-bar");
      if (!jarvisOn) {
        navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
          micStream = stream;
          jarvisOn = true;
          btn.classList.add("active");
          bar.classList.add("show");
          document.getElementById("jarvis-status").textContent = "Recording... tap mic to stop";
          addLog("Recording...", "sent");
          audioChunks = [];
          recCtx = new (window.AudioContext || window.webkitAudioContext)();
          var source = recCtx.createMediaStreamSource(stream);
          audioProcessor = recCtx.createScriptProcessor(4096, 1, 1);
          audioProcessor.onaudioprocess = function(e) {
            var data = e.inputBuffer.getChannelData(0);
            var pcm = new Int16Array(data.length);
            for (var i = 0; i < data.length; i++) {
              pcm[i] = Math.max(-32768, Math.min(32767, data[i] * 32767));
            }
            audioChunks.push(pcm);
          };
          source.connect(audioProcessor);
          audioProcessor.connect(recCtx.destination);
        }).catch(function(e) {
          addLog("Mic access denied", "error");
        });
      } else {
        jarvisOn = false;
        btn.classList.remove("active");
        document.getElementById("jarvis-status").textContent = "Transcribing...";
        if (audioProcessor) audioProcessor.disconnect();
        if (micStream) micStream.getTracks().forEach(function(t) { t.stop(); });
        var totalLen = audioChunks.reduce(function(s, c) { return s + c.length; }, 0);
        if (totalLen < 1600) {
          bar.classList.remove("show");
          addLog("Too short", "error");
          return;
        }
        var merged = new Int16Array(totalLen);
        var off = 0;
        for (var i = 0; i < audioChunks.length; i++) {
          merged.set(audioChunks[i], off);
          off += audioChunks[i].length;
        }
        var rate = recCtx ? recCtx.sampleRate : 44100;
        var wav = buildWav(merged, rate);
        fetch(SERVER + "/transcribe", {
          method: "POST",
          body: wav,
          headers: { "Content-Type": "audio/wav" }
        }).then(function(r) { return r.json(); }).then(function(data) {
          bar.classList.remove("show");
          if (data.text) {
            document.getElementById("jarvis-status").textContent = "Heard: " + data.text;
            sendVoiceCmd(data.text);
          } else {
            addLog("Couldn't understand", "error");
          }
        }).catch(function() {
          bar.classList.remove("show");
          addLog("Transcribe failed", "error");
        });
        if (recCtx) recCtx.close();
      }
    }

    function startListening() {
      if (!jarvisOn) return;
      recognition = new SpeechRec();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = function(e) {
        var final = "";
        var interim = "";
        for (var i = e.resultIndex; i < e.results.length; i++) {
          if (e.results[i].isFinal) {
            final += e.results[i][0].transcript;
          } else {
            interim += e.results[i][0].transcript;
          }
        }
        if (interim) {
          document.getElementById("jarvis-status").textContent = interim;
        }
        if (final) {
          document.getElementById("jarvis-status").textContent = "Heard: " + final.trim();
          sendVoiceCmd(final);
          setTimeout(function() {
            if (jarvisOn) document.getElementById("jarvis-status").textContent = "Listening...";
          }, 2000);
        }
      };

      recognition.onerror = function(e) {
        if (e.error === "no-speech" || e.error === "aborted") return;
        addLog("Mic error: " + e.error, "error");
      };

      recognition.onend = function() {
        if (jarvisOn) setTimeout(startListening, 300);
      };

      recognition.start();
    }
  </script>
</body>
</html>
