<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Remote Console · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
      --green: #22c55e;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "Cascadia Code", "Fira Code", Consolas, monospace;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--fg); }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      font-weight: 600;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
    }
    .status .dot.online { background: var(--green); }
    .console {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .console-header {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    .log {
      height: 320px;
      overflow-y: auto;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.7;
    }
    .log .entry { color: var(--muted); }
    .log .entry.sent { color: var(--green); }
    .log .entry.error { color: var(--red); }
    .log .entry .time { color: #555; margin-right: 8px; }
    .input-row {
      display: flex;
      border-top: 1px solid var(--line);
    }
    .input-row input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      padding: 14px 16px;
      outline: none;
    }
    .input-row input::placeholder { color: #444; }
    .input-row button {
      padding: 14px 24px;
      background: transparent;
      border: none;
      border-left: 1px solid var(--line);
      color: var(--green);
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 120ms;
    }
    .input-row button:hover { background: #1a1a1e; }
    .help {
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.8;
    }
    .help code {
      background: var(--card);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/moding">← back</a>
    <h1 style="font-family: ui-sans-serif, system-ui, sans-serif;">Factions Remote Console</h1>
    <p class="subtitle"></p>

    <div class="console">
      <div class="console-header">
        <span>console</span>
        <span id="count">0 commands sent</span>
      </div>
      <div class="log" id="log">
        <div class="entry"><span class="time">--:--</span>Ready. Type a command below.</div>
      </div>
      <div class="input-row">
        <input type="text" id="cmd" placeholder="/help" autocomplete="off" spellcheck="false" />
        <button onclick="sendCmd()">send</button>
      </div>
    </div>

    <div class="help">
      <strong>Commands:</strong><br>
      <code>/help</code> list commands &nbsp;
      <code>/time set 6000</code> daytime &nbsp;
      <code>/drop iron_sword</code> drop item<br>
      <code>/tp player1 player2</code> teleport &nbsp;
      <code>/kill player</code> &nbsp;
      <code>/god player</code> toggle god
    </div>
  </main>
  <script>
    var TOPIC = "wolver002-factions-" + "cmd-v1";
    var count = 0;
    var input = document.getElementById("cmd");
    var log = document.getElementById("log");

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendCmd();
    });

    function ts() {
      var d = new Date();
      return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
    }

    function addLog(msg, cls) {
      var div = document.createElement("div");
      div.className = "entry " + (cls || "");
      div.innerHTML = '<span class="time">' + ts() + "</span>" + msg;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function sendCmd() {
      var cmd = input.value.trim();
      if (!cmd) return;
      input.value = "";

      fetch("https://ntfy.sh/" + TOPIC, {
        method: "POST",
        body: cmd,
        headers: { "Title": "cmd" }
      }).then(function(r) {
        if (r.ok) {
          count++;
          document.getElementById("count").textContent = count + " command" + (count === 1 ? "" : "s") + " sent";
          addLog("$ " + cmd, "sent");
        } else {
          addLog("Failed to send: " + cmd, "error");
        }
      }).catch(function(e) {
        addLog("Error: " + e.message, "error");
      });
    }
  </script>
</body>
</html>
