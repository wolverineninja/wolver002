<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cool Projects · wolver002</title>
  <link rel="icon" href="/wfm/favicon.png" />
  <style>
    @font-face{font-family:MC;src:url('/wfm/Minecraft.otf');font-weight:normal}
    @font-face{font-family:MC;src:url('/wfm/Minecraft-Bold.otf');font-weight:bold}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:MC,monospace;color:#e8e8e8;min-height:100vh;-webkit-font-smoothing:none;font-smooth:never;
      background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),url('/wfm/dirt.png');
      background-size:auto,48px 48px;image-rendering:pixelated}
    main{max-width:760px;margin:0 auto;padding:48px 22px 72px}
    .back{display:inline-block;color:#bdbdbd;text-decoration:none;font-size:14px;margin-bottom:28px;text-shadow:1px 1px #000}
    .back:hover{color:#ffd98a}
    h1{font-size:clamp(26px,5vw,42px);color:#fff;font-weight:bold;text-shadow:3px 3px #3e3e3e;margin:0 0 14px}
    .tagline{color:#bdbdbd;font-size:15px;text-shadow:1px 1px #000;margin:0 0 32px;line-height:1.6}
    .buttons{display:flex;gap:12px;flex-wrap:wrap}
    .btn{font-family:MC,monospace;font-size:15px;color:#fff;text-shadow:1px 1px #3e3e3e;cursor:pointer;text-decoration:none;
      background:#6d6d6d;border:2px solid;border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;
      padding:9px 16px 11px;display:inline-flex;align-items:center;gap:8px;transition:background .1s,border-color .1s}
    .btn:hover{background:#7c81b8;border-color:#b6bae6 #43436e #43436e #b6bae6}
    .btn:active{border-color:#383838 #a6a6a6 #a6a6a6 #383838}
    .btn:focus-visible{outline-color:#ffd98a}
    .empty{color:#8f8f8f;font-size:14px;text-shadow:1px 1px #000;
      background:rgba(0,0,0,.5);border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;padding:16px 18px;display:inline-block}
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">&larr; back</a>
    <h1>Cool Projects</h1>

    <div class="buttons">
    </div>
  </main>
</body>
</html>
