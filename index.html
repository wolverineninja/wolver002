<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wolver002</title>
  <meta name="description" content="Personal site of wolver002." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --accent: #e8e8ea;
      --card: #111114;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    html { min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-feature-settings: "ss01", "cv01";
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      padding: 28px 18px 36px;
    }
    header { margin-bottom: 28px; }
    h1 {
      font-size: 26px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin: 0 0 10px;
      font-weight: 600;
    }
    .tagline {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 20px;
      max-width: 60ch;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .links a {
      color: var(--fg);
      text-decoration: none;
      border-bottom: 1px solid var(--line);
      padding-bottom: 2px;
      transition: border-color 120ms ease, color 120ms ease;
    }
    .links a:hover { border-color: var(--fg); }

    section { margin-top: 28px; }
    h2 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 14px;
    }
    .projects {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .card {
      display: block;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }
    .card:hover {
      border-color: #2a2a30;
      background: #131318;
    }
    .card h3 {
      margin: 0 0 6px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 13.5px;
    }

    footer {
      margin-top: auto;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    @media (min-width: 768px) {
      main {
        padding: 7vh 6vw 6vh;
        justify-content: flex-start;
      }
      header { margin-bottom: 8vh; }
      h1 {
        font-size: clamp(56px, 8vw, 104px);
        line-height: 1.05;
        margin: 0 0 24px;
      }
      .tagline {
        font-size: clamp(18px, 1.6vw, 24px);
        max-width: 72ch;
        margin: 0 0 32px;
      }
      section { margin-top: 6vh; }
      h2 {
        font-size: 14px;
        margin: 0 0 28px;
      }
      .projects {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
      .card { padding: 28px 30px; }
      .card h3 { font-size: 19px; }
      .card p { font-size: 15.5px; }
      footer {
        padding-top: 32px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Shout Out Ball Zach</h1>
      <p class="tagline">Just A Guy That Likes To Make Things - Avid Modder</p>
    </header>

    <section>
      <h2>Projects</h2>
      <div class="projects">
        <a class="card" href="/moding">
          <h3>VR-Moding</h3>
        </a>
        <a class="card" href="/coolprojects">
          <h3>Cool Projects</h3>
        </a>
        <a class="card" href="#">
        </a>
      </div>
    </section>

    <footer>
      &copy; <span id="year"></span> wolver002
    </footer>
  </main>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
