<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wolver002</title>
  <meta name="description" content="Personal site of wolver002." />
  <link rel="icon" href="/wfm/favicon.png" />
  <style>
    @font-face{font-family:MC;src:url('/wfm/Minecraft.otf');font-weight:normal}
    @font-face{font-family:MC;src:url('/wfm/Minecraft-Bold.otf');font-weight:bold}
    *{margin:0;padding:0;box-sizing:border-box}
    html{min-height:100%}
    body{font-family:MC,monospace;color:#e8e8e8;min-height:100vh;-webkit-font-smoothing:none;font-smooth:never;
      display:flex;flex-direction:column;
      background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,.62)),url('/wfm/dirt.png');
      background-size:auto,48px 48px;image-rendering:pixelated}

    main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:56px 22px 40px}

    header{margin-bottom:40px}
    h1{font-size:clamp(30px,6vw,60px);line-height:1.1;color:#fff;font-weight:bold;
      text-shadow:3px 3px #3e3e3e;margin:0 0 14px}
    h1 span{color:#ffd98a}
    .tagline{color:#bdbdbd;font-size:clamp(13px,1.6vw,16px);text-shadow:1px 1px #000;
      margin:0 0 22px;max-width:60ch;line-height:1.6}

    .btn{font-family:MC,monospace;font-size:15px;color:#fff;text-shadow:1px 1px #3e3e3e;cursor:pointer;text-decoration:none;
      background:#6d6d6d;border:2px solid;border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;
      padding:7px 15px 9px;display:inline-flex;align-items:center;gap:8px;transition:background .1s,border-color .1s}
    .btn:hover{background:#7c81b8;border-color:#b6bae6 #43436e #43436e #b6bae6}
    .btn:active{border-color:#383838 #a6a6a6 #a6a6a6 #383838}
    .btn:focus-visible{outline-color:#ffd98a}
    .btn.discord{background:#42469e;border-color:#7c81d6 #23264f #23264f #7c81d6}
    .btn.discord:hover{background:#5865F2;border-color:#9aa2ff #2a2e6e #2a2e6e #9aa2ff}
    .discord-btn{margin-bottom:4px}

    section{margin-top:12px}
    h2{font-size:14px;font-weight:bold;text-transform:uppercase;letter-spacing:.14em;color:#ffd98a;
      text-shadow:1px 1px #000;margin:0 0 16px;padding-bottom:8px;border-bottom:2px solid #444}

    .projects{display:grid;grid-template-columns:1fr;gap:14px}
    @media(min-width:620px){.projects{grid-template-columns:repeat(2,1fr)}}
    .card{display:block;padding:18px 20px;color:#e8e8e8;text-decoration:none;
      background:rgba(0,0,0,.5);border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;
      transition:background .1s,box-shadow .1s}
    .card:hover{background:rgba(60,60,90,.5);box-shadow:0 0 0 2px #b6bae6}
    .card h3{margin:0;font-size:19px;color:#fff;font-weight:bold;text-shadow:2px 2px #3e3e3e}
    .card .arrow{float:right;color:#8f8f8f}
    .card:hover .arrow{color:#ffd98a}

    footer{margin-top:auto;padding-top:22px;border-top:2px solid #333;color:#8f8f8f;font-size:12px;
      text-shadow:1px 1px #000}

    /* universal account login (shared across wolver002 pages via localStorage) */
    .auth-btn{position:fixed;top:16px;right:16px;z-index:50;font-family:MC,monospace;font-size:14px;color:#fff;
      text-shadow:1px 1px #3e3e3e;cursor:pointer;background:#6d6d6d;border:2px solid;
      border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;padding:6px 13px 8px}
    .auth-btn:hover{background:#7c81b8;border-color:#b6bae6 #43436e #43436e #b6bae6}
    .auth-btn .uname{color:#5aff5a}
    .auth-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
      background:rgba(0,0,0,.72)}
    .auth-modal.show{display:flex}
    .auth-box{width:min(92vw,360px);background:rgba(0,0,0,.72);border:2px solid #000;box-shadow:0 0 0 2px #4a4a4a;
      padding:24px}
    .auth-box h2{font-size:18px;color:#fff;font-weight:bold;text-shadow:2px 2px #3e3e3e;
      text-transform:none;letter-spacing:normal;border:0;padding:0;margin:0 0 18px}
    .auth-box input{width:100%;font-family:MC,monospace;background:#000;border:2px solid #a0a0a0;color:#fff;
      font-size:14px;padding:9px 11px;margin-bottom:12px}
    .auth-box input:focus{outline:none;border-color:#fff}
    .auth-box input::placeholder{color:#8a8a8a}
    .auth-btns{display:flex;gap:10px;margin-top:6px}
    .auth-btns .btn{flex:1;justify-content:center}
    .auth-btns .btn-li{background:#3a7a3a;border-color:#6fb06f #204020 #204020 #6fb06f}
    .auth-btns .btn-li:hover{background:#4a9a4a;border-color:#8fd08f #2a5a2a #2a5a2a #8fd08f}
    .auth-note{color:#ffd98a;font-size:11px;letter-spacing:.02em;margin-bottom:14px;line-height:1.5;
      background:#000;border:2px solid #a8792f;padding:8px 10px;text-shadow:1px 1px #000}
    .auth-err{color:#ff8080;font-size:12px;margin-top:12px;min-height:16px;text-shadow:1px 1px #000}
    @media(max-width:480px){.auth-btns{flex-direction:column}}
  </style>
</head>
<body>
  <button class="auth-btn" id="auth-btn" onclick="openAuth()">Log In</button>
  <div class="auth-modal" id="auth-modal">
    <div class="auth-box">
      <h2>Account</h2>
      <div class="auth-note">[!] YOU CAN'T CHANGE YOUR USERNAME &mdash; CHOOSE IT WISELY</div>
      <input type="text" id="auth-user" placeholder="Username" autocomplete="off" />
      <input type="password" id="auth-pass" placeholder="Password" autocomplete="off" />
      <div class="auth-btns">
        <button class="btn btn-su" onclick="doSignup()">Sign Up</button>
        <button class="btn btn-li" onclick="doLogin()">Log In</button>
      </div>
      <div class="auth-err" id="auth-err"></div>
    </div>
  </div>
  <main>
    <header>
      <h1>Shout Out <span>Ball Zach</span></h1>
      <p class="tagline">Just A Guy That Likes To Make Things &mdash; Avid Modder</p>
      <a class="btn discord discord-btn" href="https://discord.gg/DhxucDEPJY" target="_blank" rel="noopener noreferrer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.369A19.79 19.79 0 0 0 16.558 3.2a.074.074 0 0 0-.079.037c-.34.6-.715 1.382-.978 1.997a18.27 18.27 0 0 0-5.487 0 12.51 12.51 0 0 0-.992-1.997.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.683 4.369a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.371-.291a.074.074 0 0 1 .077-.01c3.927 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.009c.12.099.245.198.372.292a.077.077 0 0 1-.006.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.182 0-2.157-1.086-2.157-2.42 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.419-2.157 2.419zm7.974 0c-1.183 0-2.157-1.086-2.157-2.42 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.419-2.157 2.419z"/></svg>
        join discord fr
      </a>
    </header>

    <section>
      <h2>Projects</h2>
      <div class="projects">
        <a class="card" href="/moding"><h3>VR-Moding <span class="arrow">&rsaquo;</span></h3></a>
        <a class="card" href="/coolprojects"><h3>Cool Projects <span class="arrow">&rsaquo;</span></h3></a>
      </div>
    </section>
  </main>

  <footer>wolver002</footer>

  <script>
    // Universal account login — backend at admin.wolver002.com, state kept in localStorage,
    // so a login here carries across every wolver002.com page (shared origin).
    var SERVER = "https://admin.wolver002.com";
    var userToken = localStorage.getItem("rc_user_token") || "";
    var userName = localStorage.getItem("rc_user_name") || "";

    function updateAuthBtn() {
      var btn = document.getElementById("auth-btn");
      if (userToken && userName) {
        btn.innerHTML = '<span class="uname">' + userName + '</span> &#8226; Log Out';
        btn.onclick = doLogout;
      } else {
        btn.innerHTML = 'Log In';
        btn.onclick = openAuth;
      }
    }
    function openAuth() {
      document.getElementById("auth-err").textContent = "";
      document.getElementById("auth-user").value = "";
      document.getElementById("auth-pass").value = "";
      document.getElementById("auth-modal").classList.add("show");
      setTimeout(function() { document.getElementById("auth-user").focus(); }, 100);
    }
    function closeAuth() { document.getElementById("auth-modal").classList.remove("show"); }

    // stable per-device fingerprint (no email, so signup is limited to 1 account per device).
    // recomputed each time (not stored), so clearing site data doesn't grant a new signup.
    function deviceHwid() {
      var parts = [
        navigator.userAgent || "", navigator.language || "", navigator.platform || "",
        (navigator.hardwareConcurrency || "") + "", (navigator.deviceMemory || "") + "",
        screen.width + "x" + screen.height + "x" + screen.colorDepth,
        (function(){ try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch(e){ return ""; } })()
      ];
      try {
        var cv = document.createElement("canvas"), ctx = cv.getContext("2d");
        ctx.textBaseline = "top"; ctx.font = "14px Arial";
        ctx.fillStyle = "#f60"; ctx.fillRect(0, 0, 100, 20);
        ctx.fillStyle = "#069"; ctx.fillText("wolver-hwid", 2, 2);
        parts.push(cv.toDataURL());
      } catch (e) {}
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(parts.join("|"))).then(function(buf) {
        return Array.from(new Uint8Array(buf)).map(function(b) { return ("0" + b.toString(16)).slice(-2); }).join("");
      });
    }
    function authRequest(path, hwid) {
      var u = document.getElementById("auth-user").value.trim();
      var p = document.getElementById("auth-pass").value;
      if (!u || !p) { document.getElementById("auth-err").textContent = "Fill in both fields"; return; }
      var payload = { username: u, password: p };
      if (hwid) payload.hwid = hwid;
      fetch(SERVER + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(function(r) { return r.json(); }).then(function(d) {
        if (d.error) { document.getElementById("auth-err").textContent = d.error; return; }
        userToken = d.token;
        userName = d.username;
        localStorage.setItem("rc_user_token", userToken);
        localStorage.setItem("rc_user_name", userName);
        closeAuth();
        updateAuthBtn();
      }).catch(function() { document.getElementById("auth-err").textContent = "Server offline"; });
    }
    function doLogin() { authRequest("/account/login"); }
    function doSignup() {
      document.getElementById("auth-err").textContent = "Verifying device…";
      deviceHwid().then(function(hwid) { authRequest("/account/signup", hwid); })
        .catch(function() { authRequest("/account/signup", ""); });
    }
    function doLogout() {
      userToken = ""; userName = "";
      localStorage.removeItem("rc_user_token");
      localStorage.removeItem("rc_user_name");
      updateAuthBtn();
    }

    document.getElementById("auth-modal").addEventListener("click", function(e) {
      if (e.target === this) closeAuth();
    });
    document.getElementById("auth-pass").addEventListener("keydown", function(e) {
      if (e.key === "Enter") doLogin();
    });
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") closeAuth();
    });
    // reflect login state saved by any other page
    window.addEventListener("storage", function(e) {
      if (e.key === "rc_user_token" || e.key === "rc_user_name") {
        userToken = localStorage.getItem("rc_user_token") || "";
        userName = localStorage.getItem("rc_user_name") || "";
        updateAuthBtn();
      }
    });
    updateAuthBtn();
  </script>
</body>
</html>
