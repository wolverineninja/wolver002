<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VR-Moding · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    .back {
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
      display: inline-block;
      margin-bottom: 32px;
    }
    .back:hover { color: var(--fg); }
    h1 {
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .tagline {
      color: var(--muted);
      margin: 0 0 36px;
    }
    .archive-button {
      display: inline-block;
      padding: 12px 20px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--fg);
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      user-select: none;
      transition: border-color 160ms ease, background 160ms ease;
    }
    .archive-button:hover {
      border-color: #2a2a30;
      background: #131318;
    }
    .archive-label {
      opacity: 0.6;
      font-size: 12px;
      letter-spacing: 0.04em;
      margin-left: 6px;
    }
    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .wink-msg {
      margin-top: 16px;
      font-size: 24px;
      display: none;
    }
    .video-wrap {
      margin-top: 24px;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
    }
    .video-wrap video {
      display: block;
      width: 100%;
      height: auto;
      max-height: 70vh;
    }
  </style>
</head>
<body>
  <main>
    <a class="back" href="/">← back</a>
    <h1>VR-Moding</h1>
    <p class="tagline">Past VR projects.</p>

    <div class="buttons">
      <button class="archive-button" onclick="document.getElementById('wink').style.display='block'">
        FactionsVR<span class="archive-label">(Working)</span>
      </button>
      <a class="archive-button" href="/factionsvr">
        FactionsVR<span class="archive-label">(Archived)</span>
      </a>
    </div>
    <p class="wink-msg" id="wink">You will see 😉</p>
  </main>
</body>
</html>
