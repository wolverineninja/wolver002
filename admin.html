<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · wolver002</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%97%8F%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #e8e8ea;
      --muted: #8a8a92;
      --line: #1f1f23;
      --card: #111114;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px 96px;
    }
    h1 {
      font-size: clamp(24px, 4vw, 36px);
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 13px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }
    .row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .row:last-child { margin-bottom: 0; }
    input, select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font: inherit;
      font-size: 14px;
      padding: 10px 14px;
      outline: none;
    }
    select {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--fg);
      font: inherit;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      cursor: pointer;
      -webkit-appearance: none;
    }
    select:focus { border-color: #333; }
    input:focus { border-color: #333; }
    input::placeholder { color: #444; }
    button {
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 120ms, border-color 120ms;
      white-space: nowrap;
    }
    .btn-green {
      background: var(--green);
      border-color: var(--green);
      color: #000;
    }
    .btn-green:hover { background: #1aaf52; }
    .btn-blue {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }
    .btn-blue:hover { background: #2563eb; }
    .btn-red {
      background: transparent;
      border-color: var(--red);
      color: var(--red);
    }
    .btn-red:hover { background: #1a0a0a; }
    .btn-dark {
      background: var(--bg);
      border-color: var(--line);
      color: var(--fg);
    }
    .btn-dark:hover { background: #1a1a1e; }
    .btn-yellow {
      background: var(--yellow);
      border-color: var(--yellow);
      color: #000;
    }
    .btn-yellow:hover { background: #d4a107; }
    .btn-yellow.active {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .presets button {
      padding: 6px 14px;
      font-size: 13px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      margin-right: 6px;
    }
    .status-dot.on { background: var(--green); }
    #status-text {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .log {
      margin-top: 14px;
      max-height: 200px;
      overflow-y: auto;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.8;
    }
    .log .entry { color: var(--muted); }
    .log .entry.ok { color: var(--green); }
    .log .entry.err { color: var(--red); }
    .timer-preview {
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
      font-size: 32px;
      text-align: center;
      padding: 16px;
      color: var(--yellow);
    }
  </style>
</head>
<body>
  <main>
    <h1>Admin Console</h1>
    <p id="status-text"><span class="status-dot" id="dot"></span>Checking server...</p>

    <div class="panel">
      <div class="panel-title">Broadcast Message</div>
      <div class="row">
        <input type="text" id="msg" placeholder="Type a message to show on all screens..." />
        <button class="btn-green" onclick="sendBroadcast()">Send</button>
      </div>
      <div class="presets">
        <button class="btn-dark" onclick="quickMsg('Server restarting soon')">Restart Warning</button>
        <button class="btn-dark" onclick="quickMsg('Event starting!')">Event</button>
        <button class="btn-dark" onclick="quickMsg('GG everyone')">GG</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Timer</div>
      <div class="timer-preview" id="timer-preview">--:--</div>
      <div class="row">
        <input type="text" id="timer-label" placeholder="Label (optional)" />
        <input type="number" id="timer-sec" placeholder="Seconds" min="1" style="max-width:120px" />
        <button class="btn-blue" onclick="startTimer()">Start</button>
        <button class="btn-red" onclick="stopTimer()">Stop</button>
      </div>
      <div class="row">
        <select id="timer-start-action">
          <option value="none">When started: Nothing</option>
          <option value="pause">When started: Pause commands</option>
          <option value="resume">When started: Resume commands</option>
          <option value="broadcast">When started: Broadcast label</option>
        </select>
        <select id="timer-end-action">
          <option value="none">When done: Nothing</option>
          <option value="pause">When done: Pause commands</option>
          <option value="resume">When done: Resume commands</option>
          <option value="broadcast">When done: Broadcast "Timer done"</option>
        </select>
      </div>
      <div class="presets">
        <button class="btn-dark" onclick="presetTimer(30)">0:30</button>
        <button class="btn-dark" onclick="presetTimer(60)">1:00</button>
        <button class="btn-dark" onclick="presetTimer(180)">3:00</button>
        <button class="btn-dark" onclick="presetTimer(300)">5:00</button>
        <button class="btn-dark" onclick="presetTimer(600)">10:00</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Game Command</div>
      <div class="row">
        <input type="text" id="cmd" placeholder="/kill player" />
        <button class="btn-green" onclick="sendCmd()">Send</button>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Controls</div>
      <div class="row">
        <button class="btn-yellow" id="pause-btn" onclick="togglePause()">Pause Commands</button>
        <button class="btn-red" onclick="clearAll()">Clear All</button>
      </div>
    </div>

    <div class="log" id="log"></div>
  </main>

  <script>
    var SERVER = "https://admin.wolver002.com";
    var logEl = document.getElementById("log");
    var timerInterval = null;
    var timerEnd = 0;

    document.getElementById("msg").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendBroadcast();
    });
    document.getElementById("cmd").addEventListener("keydown", function(e) {
      if (e.key === "Enter") sendCmd();
    });

    function ts() {
      var d = new Date();
      return d.getHours().toString().padStart(2,"0") + ":" + d.getMinutes().toString().padStart(2,"0");
    }

    function addLog(msg, cls) {
      var div = document.createElement("div");
      div.className = "entry " + (cls || "ok");
      div.textContent = ts() + "  " + msg;
      logEl.appendChild(div);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function post(path, body) {
      return fetch(SERVER + path, {
        method: "POST",
        body: typeof body === "string" ? body : JSON.stringify(body),
        headers: {"Content-Type": "application/json"}
      });
    }

    function sendBroadcast() {
      var msg = document.getElementById("msg").value.trim();
      if (!msg) return;
      document.getElementById("msg").value = "";
      post("/broadcast", msg).then(function() {
        addLog("Broadcast: " + msg);
      }).catch(function() { addLog("Failed to send", "err"); });
    }

    function quickMsg(msg) {
      document.getElementById("msg").value = msg;
      sendBroadcast();
    }

    function sendCmd() {
      var cmd = document.getElementById("cmd").value.trim();
      if (!cmd) return;
      document.getElementById("cmd").value = "";
      fetch(SERVER, { method: "POST", body: cmd }).then(function() {
        addLog("Command: " + cmd);
      }).catch(function() { addLog("Failed to send", "err"); });
    }

    function runAction(action, label) {
      if (action === "pause") post("/pause", "").then(function(r) { return r.json(); }).then(function(d) {
        if (!d.paused) post("/pause", "");
        addLog("Auto: paused commands");
      });
      if (action === "resume") post("/pause", "").then(function(r) { return r.json(); }).then(function(d) {
        if (d.paused) post("/pause", "");
        addLog("Auto: resumed commands");
      });
      if (action === "broadcast") {
        var msg = label || "Timer done";
        post("/broadcast", msg);
        addLog("Auto: broadcast '" + msg + "'");
      }
    }

    var timerEndAction = "none";

    function startTimer() {
      var sec = parseInt(document.getElementById("timer-sec").value) || 60;
      var label = document.getElementById("timer-label").value.trim();
      var startAction = document.getElementById("timer-start-action").value;
      timerEndAction = document.getElementById("timer-end-action").value;
      timerEnd = Date.now() + sec * 1000;
      post("/timer", { seconds: sec, label: label }).then(function() {
        addLog("Timer started: " + sec + "s" + (label ? " - " + label : ""));
        if (startAction !== "none") runAction(startAction, label);
        tickTimer();
      }).catch(function() { addLog("Failed", "err"); });
    }

    function stopTimer() {
      timerEnd = 0;
      post("/timer", { seconds: 0 }).then(function() {
        addLog("Timer stopped");
        document.getElementById("timer-preview").textContent = "--:--";
      });
    }

    function presetTimer(sec) {
      document.getElementById("timer-sec").value = sec;
      startTimer();
    }

    function tickTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(function() {
        var left = Math.max(0, Math.round((timerEnd - Date.now()) / 1000));
        var m = Math.floor(left / 60);
        var s = left % 60;
        document.getElementById("timer-preview").textContent =
          m.toString().padStart(2, "0") + ":" + s.toString().padStart(2, "0");
        if (left <= 0) {
          clearInterval(timerInterval);
          document.getElementById("timer-preview").textContent = "00:00";
          if (timerEndAction !== "none") {
            runAction(timerEndAction, "Timer done");
            timerEndAction = "none";
          }
        }
      }, 200);
    }

    function togglePause() {
      post("/pause", "").then(function(r) { return r.json(); }).then(function(data) {
        var btn = document.getElementById("pause-btn");
        if (data.paused) {
          btn.textContent = "Resume Commands";
          btn.classList.add("active");
          addLog("Commands PAUSED");
        } else {
          btn.textContent = "Pause Commands";
          btn.classList.remove("active");
          addLog("Commands RESUMED");
        }
      });
    }

    function clearAll() {
      post("/clear", "").then(function() {
        addLog("Cleared all popups & timers");
        timerEnd = 0;
        document.getElementById("timer-preview").textContent = "--:--";
      });
    }

    function checkServer() {
      fetch(SERVER + "/poll").then(function(r) {
        if (r.ok) {
          document.getElementById("dot").classList.add("on");
          document.getElementById("status-text").innerHTML =
            '<span class="status-dot on"></span>Server online';
          return r.json();
        }
      }).then(function(data) {
        if (data && data.timer > 0 && timerEnd === 0) {
          timerEnd = Date.now() + data.timer * 1000;
          tickTimer();
        }
        if (data) {
          var btn = document.getElementById("pause-btn");
          if (data.paused) {
            btn.textContent = "Resume Commands";
            btn.classList.add("active");
          } else {
            btn.textContent = "Pause Commands";
            btn.classList.remove("active");
          }
        }
      }).catch(function() {
        document.getElementById("dot").classList.remove("on");
        document.getElementById("status-text").innerHTML =
          '<span class="status-dot"></span>Server offline';
      });
    }

    checkServer();
    setInterval(checkServer, 5000);
  </script>
</body>
</html>
