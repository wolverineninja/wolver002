<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name=description content="Wolver Factions Map — live player map for FactionsVR">
<title>Wolver Factions Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
:root{
  --bg:#0c0d11; --panel:#15171d; --panel2:#1b1e25; --line:#2a2e37; --line2:#363b46;
  --txt:#e9eaee; --dim:#878d9b; --dim2:#5f6573; --accent:#c79a55; --accent-d:#8c6a35;
  --good:#79c8a0; --bad:#c86a6a;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace}
#map{position:fixed;inset:0;background:#101118;cursor:grab}
#map:active{cursor:grabbing}
.leaflet-container{background:#101118;font:inherit}
.panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px -12px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.2)}

/* top bar */
#bar{top:16px;left:16px;right:16px;display:flex;gap:8px;align-items:center;padding:8px;z-index:20;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;padding:0 12px 0 6px;font-weight:600;font-size:14.5px;letter-spacing:-.2px}
.brand svg{width:24px;height:24px;color:var(--accent)}
.brand .lo{color:var(--dim)}
.divv{width:1px;height:26px;background:var(--line);margin:0 2px}
.field{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;height:38px;padding:0 11px}
.field:focus-within{border-color:var(--line2)}
.field .lab{color:var(--dim2);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.field input{width:74px;background:none;border:0;outline:0;color:var(--txt);font-size:13.5px;font-family:inherit}
.field input::placeholder{color:var(--dim2)}
.field input::-webkit-outer-spin-button,.field input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.btn{height:38px;padding:0 18px;border:1px solid transparent;border-radius:9px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:inherit;letter-spacing:.1px;display:inline-flex;align-items:center;gap:7px;
  background:var(--accent);color:#1a140a;transition:filter .12s}
.btn:hover{filter:brightness(1.07)}.btn:active{filter:brightness(.95)}
.btn.ic{background:var(--bg);border-color:var(--line);color:var(--dim);padding:0 11px}
.btn.ic:hover{color:var(--txt);border-color:var(--line2)}
.btn.ic svg{width:17px;height:17px}
.spacer{flex:1}
.live{display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13px}
.live .sw{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:0 0 9px;transition:background .3s}
.live .sw.on{background:var(--good);box-shadow:0 0 8px rgba(121,200,160,.5)}
.live b{font-weight:600}
.live .dl{color:var(--dim2);font-size:12px}

/* players panel */
#side{top:78px;right:16px;width:230px;max-height:calc(100vh - 104px);z-index:15;padding:4px;
  display:flex;flex-direction:column;transition:transform .25s,opacity .25s}
#side.hidden{transform:translateX(12px);opacity:0;pointer-events:none}
.grp{padding:9px 8px 6px;overflow-y:auto}
.grp::-webkit-scrollbar{width:7px}.grp::-webkit-scrollbar-track{background:transparent}
.grp::-webkit-scrollbar-thumb{background:var(--line2);border-radius:7px}
.grp h4{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim2);font-weight:700;
  margin:0 4px 7px;display:flex;align-items:center;gap:7px}
.grp h4::after{content:"";flex:1;height:1px;background:var(--line)}
.grp h4 .n{color:var(--dim)}
.it{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;user-select:none;
  font-size:13px;color:var(--dim);transition:background .1s,color .1s}
.it:hover{background:var(--panel2);color:var(--txt)}
.it.on{color:var(--txt);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent-d)}
.it .gi{width:24px;height:24px;flex:0 0 24px;border-radius:6px;overflow:hidden;background:var(--panel2);position:relative}
.it .nm{flex:1;min-width:0}
.it .nm .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it .nm .s{font-size:10.5px;color:var(--dim2)}
.it .pg{font-size:11px;color:var(--dim2);flex:none}
.pempty{color:var(--dim2);font-size:12.5px;text-align:center;padding:18px 0 14px}
.fnote{border-top:1px solid var(--line);margin-top:2px;padding:9px 12px;font-size:12px;color:var(--dim);display:none;align-items:center;gap:6px}
.fnote.on{display:flex}
.fnote b{color:var(--accent);font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fnote .stop{color:var(--dim2);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.fnote .stop:hover{color:var(--txt)}

/* bottom status */
#stat{bottom:16px;left:16px;display:flex;align-items:stretch;height:40px;z-index:15;overflow:hidden}
#stat .cell{display:flex;align-items:center;gap:7px;padding:0 14px;border-right:1px solid var(--line)}
#stat .cell:last-child{border-right:0}
#stat .k{color:var(--dim2);font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
#stat .v{font-size:13px;font-weight:500}

/* leaflet zoom → seedmap-style button column, bottom right */
.leaflet-control-zoom{border:none!important;box-shadow:0 12px 40px -12px rgba(0,0,0,.7)!important;
  border-radius:12px!important;overflow:hidden;border:1px solid var(--line)!important}
.leaflet-control-zoom a{width:40px!important;height:40px!important;line-height:40px!important;
  background:var(--panel)!important;color:var(--dim)!important;border:0!important;font-size:17px!important;font-weight:400!important}
.leaflet-control-zoom a:first-child{border-bottom:1px solid var(--line)!important}
.leaflet-control-zoom a:hover{background:var(--panel2)!important;color:var(--txt)!important}
.leaflet-bottom.leaflet-right .leaflet-control{margin:0 16px 16px 0}

/* player heads — face + hat cropped straight from the skin PNG */
.face,.hat{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated}
.gi .face{background-size:192px auto;background-position:-24px -24px}
.gi .hat{background-size:192px auto;background-position:-120px -24px}

/* map markers */
.pmarker{position:relative}
.pmarker .mhead{position:absolute;left:-15px;top:-15px;width:30px;height:30px;border-radius:7px;overflow:hidden;
  background:var(--panel2);box-shadow:0 0 0 2px var(--panel),0 4px 14px -2px rgba(0,0,0,.8)}
.pmarker .mhead .face{background-size:240px auto;background-position:-30px -30px}
.pmarker .mhead .hat{background-size:240px auto;background-position:-150px -30px}
.pmarker .mname{position:absolute;top:19px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:11px;font-weight:600;color:var(--txt);background:var(--panel);border:1px solid var(--line);
  padding:1px 7px;border-radius:6px;pointer-events:none;box-shadow:0 4px 12px -2px rgba(0,0,0,.6)}
.pmarker.sel .mhead{box-shadow:0 0 0 2px var(--accent),0 4px 14px -2px rgba(0,0,0,.8)}
.pmarker.sel .mname{border-color:var(--accent-d);color:var(--accent)}
.pmarker .arrow{position:absolute;left:-6px;top:-29px;width:12px;height:12px;pointer-events:none;transform-origin:6px 29px}
.pmarker .arrow::before{content:"";position:absolute;left:2px;top:1px;border:4px solid transparent;
  border-bottom:7px solid var(--accent);border-top:none}
#map .leaflet-marker-icon{transition:transform 2.4s linear}
#map.nozoomanim .leaflet-marker-icon{transition:none}

/* loading */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;background:var(--bg);transition:opacity .4s}
#load .ring{width:38px;height:38px;border:2.5px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#load .msg{color:var(--dim);font-size:13px;letter-spacing:.2px}

@media(max-width:760px){
  .field,.divv,#gobtn{display:none}
  .brand .lo{display:none}
  #side{width:200px}
}
</style>
</head>
<body>

<div id=map></div>
<div id=load><div class=ring></div><div class=msg>connecting to factionsvr</div></div>

<div class="panel" id=bar>
  <div class=brand>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6 stroke-linejoin=round stroke-linecap=round><path d="M6 21V4"/><path d="M6 4h12l-3 3.5L18 11H6"/></svg>
    <span>Wolver<span class=lo>Factions</span></span>
  </div>
  <div class=divv></div>
  <div class=field><span class=lab>X</span><input id=gotoX type=number placeholder="0"></div>
  <div class=field><span class=lab>Z</span><input id=gotoZ type=number placeholder="0"></div>
  <button class=btn id=gobtn onclick=goToCoords()>Go</button>
  <button class="btn ic" title="Back to origin" onclick=goToOrigin()>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round><circle cx=12 cy=12 r=7/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
  </button>
  <button class="btn ic" title="Refresh tiles" onclick=refreshTiles()>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round stroke-linejoin=round><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
  </button>
  <div class=spacer></div>
  <div class=live><span class=sw id=statusDot></span><b id=onlineCount>–</b><span class=dl>online · factionsvr.com</span></div>
  <button class="btn ic" title="Toggle player list" onclick=toggleSidebar()>
    <svg viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.6 stroke-linecap=round><circle cx=9 cy=8 r=3.2/><path d="M3.5 19c.7-3 2.9-4.5 5.5-4.5s4.8 1.5 5.5 4.5"/><circle cx=17 cy=9 r=2.4/><path d="M16 14.7c2 .3 3.6 1.5 4.3 3.8"/></svg>
  </button>
</div>

<div class="panel" id=side>
  <div class=grp>
    <h4>Players <span class=n id=playerCount></span></h4>
    <div id=playerList><div class=pempty>loading…</div></div>
  </div>
  <div class=fnote id=followNote>following <b id=followName></b><span class=stop onclick=stopFollow()>stop</span></div>
</div>

<div class="panel" id=stat>
  <div class=cell><span class=k>X</span><span class="v mono" id=statX>–</span></div>
  <div class=cell><span class=k>Z</span><span class="v mono" id=statZ>–</span></div>
  <div class=cell><span class=k>Chunk</span><span class="v mono" id=statC>–</span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══ Config ═══
const FVR = 'https://factionsvr.com';                                   // tiles + skins (plain <img>, no CORS needed)
const PLAYERS_API = 'https://admin.wolver002.com/factions/api/players'; // our CORS proxy on the wolver server
const POLL_MS = 2500;

// Tile scheme (mirrors the official map exactly so tiles line up)
const CHUNK_SIZE = 16, TILE_SIZE = 256, BASE_ZOOM = 8, MIN_ZOOM = 0, MAX_ZOOM = 11;
const UPB = (TILE_SIZE / Math.pow(2, BASE_ZOOM)) / CHUNK_SIZE; // CRS units per block
let cacheBuster = Date.now();

const toLatLng = (x, z) => [-z * UPB, x * UPB];

// ═══ Map ═══
const map = L.map('map', {
  crs: L.CRS.Simple, center: toLatLng(175.5, 414.5), zoom: BASE_ZOOM - 4,
  minZoom: MIN_ZOOM, maxZoom: MAX_ZOOM, zoomControl: false, attributionControl: false
});
L.control.zoom({ position: 'bottomright' }).addTo(map);

L.TileLayer.ChunkLayer = L.TileLayer.extend({
  getTileUrl(coords) {
    const tz = coords.z - BASE_ZOOM;
    if (tz >= 0) {
      const s = Math.pow(2, tz);
      return `${FVR}/api/map/chunk/0/${Math.floor(coords.x/s)}/${Math.floor(coords.y/s)}?t=${cacheBuster}`;
    }
    return `${FVR}/api/map/chunk/${tz}/${coords.x}/${coords.y}?t=${cacheBuster}`;
  },
  createTile(coords, done) {
    const tile = document.createElement('img');
    tile.alt = ''; tile.style.imageRendering = 'pixelated';
    tile.onload = () => done(null, tile);
    tile.onerror = () => { tile.style.visibility = 'hidden'; done(null, tile); };
    tile.src = this.getTileUrl(coords);
    return tile;
  }
});
const tileLayer = new L.TileLayer.ChunkLayer('', {
  tileSize: TILE_SIZE, noWrap: true, keepBuffer: 8,
  updateWhenZooming: false, updateWhenIdle: false,
  bounds: [[-1e9,-1e9],[1e9,1e9]], maxNativeZoom: BASE_ZOOM, minNativeZoom: MIN_ZOOM,
  errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
}).addTo(map);

tileLayer.once('load', hideLoading);
setTimeout(hideLoading, 6000); // safety net if a tile hangs

function hideLoading() {
  const el = document.getElementById('load');
  if (!el || el.style.opacity === '0') return;
  el.style.opacity = '0'; setTimeout(() => el.remove(), 450);
}

// ═══ Status bar / controls ═══
map.on('mousemove', e => {
  const x = Math.floor(e.latlng.lng / UPB), z = -Math.ceil(e.latlng.lat / UPB);
  document.getElementById('statX').textContent = x;
  document.getElementById('statZ').textContent = z;
  document.getElementById('statC').textContent = `${Math.floor(x/16)}, ${Math.floor(z/16)}`;
});
function goToCoords() {
  const x = parseInt(document.getElementById('gotoX').value) || 0;
  const z = parseInt(document.getElementById('gotoZ').value) || 0;
  map.setView(toLatLng(x, z), Math.max(map.getZoom(), BASE_ZOOM - 2));
}
function goToOrigin() { map.setView(toLatLng(0, 0), BASE_ZOOM - 2); }
function refreshTiles() { cacheBuster = Date.now(); tileLayer.redraw(); }
document.querySelectorAll('.field input').forEach(i =>
  i.addEventListener('keydown', e => { if (e.key === 'Enter') goToCoords(); }));

let sidebarOpen = true;
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('side').classList.toggle('hidden', !sidebarOpen);
}

// ═══ Players ═══
const markers = new Map();   // id -> {marker, skin}
let followId = null;
let lastPlayers = [];

const skinUrl = id => `${FVR}/api/game/skin/image/${id}`;
function headHtml(skinId) {
  const bg = skinId ? `style="background-image:url('${skinUrl(skinId)}')"` : '';
  return `<div class=face ${bg}></div><div class=hat ${bg}></div>`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function markerIcon(p, selected) {
  const heading = p.Pose?.Heading ?? 0;
  return L.divIcon({
    className: '', iconSize: [0, 0],
    html: `<div class="pmarker${selected ? ' sel' : ''}">
      <div class=arrow style="transform:rotate(${-heading}deg)"></div>
      <div class=mhead>${headHtml(p.SkinId)}</div>
      <div class=mname>${escapeHtml(p.Username || '?')}</div>
    </div>`
  });
}

function setFollow(id, name) {
  followId = (followId === id) ? null : id;
  const note = document.getElementById('followNote');
  note.classList.toggle('on', !!followId);
  if (followId) document.getElementById('followName').textContent = name;
  syncSel();
}
function stopFollow() { followId = null; document.getElementById('followNote').classList.remove('on'); syncSel(); }

function syncSel() {
  document.querySelectorAll('#playerList .it').forEach(el =>
    el.classList.toggle('on', followId === Number(el.dataset.id)));
  for (const [id, e] of markers)
    e.marker.getElement()?.querySelector('.pmarker')?.classList.toggle('sel', followId === id);
}

function updateMarkers(players) {
  const seen = new Set();
  for (const p of players) {
    const pos = p.Pose?.Head?.Position;
    if (!pos) continue;
    seen.add(p.id);
    const ll = toLatLng(pos[0], pos[2]);
    let e = markers.get(p.id);
    if (!e) {
      const m = L.marker(ll, { icon: markerIcon(p, followId === p.id) }).addTo(map);
      m.on('click', () => setFollow(p.id, p.Username));
      e = { marker: m, skin: p.SkinId };
      markers.set(p.id, e);
    } else {
      // update in place — recreating the icon every poll causes flicker and kills the glide transition
      e.marker.setLatLng(ll);
      const root = e.marker.getElement()?.querySelector('.pmarker');
      if (root) {
        root.querySelector('.arrow').style.transform = `rotate(${-(p.Pose?.Heading ?? 0)}deg)`;
        if (e.skin !== p.SkinId) {
          e.skin = p.SkinId;
          root.querySelectorAll('.face,.hat').forEach(d => d.style.backgroundImage = `url('${skinUrl(p.SkinId)}')`);
        }
      }
    }
    if (followId === p.id) map.panTo(ll, { animate: true, duration: 0.4 });
  }
  for (const [id, m] of markers) {
    if (!seen.has(id)) { map.removeLayer(m.marker); markers.delete(id); if (followId === id) stopFollow(); }
  }
}

let rosterKey = '';
function renderList(players) {
  const list = document.getElementById('playerList');
  document.getElementById('onlineCount').textContent = players.length;
  document.getElementById('playerCount').textContent = players.length || '';
  if (!players.length) { list.innerHTML = '<div class=pempty>no players online</div>'; rosterKey = ''; return; }
  const sorted = [...players].sort((a, b) => (a.Username || '').localeCompare(b.Username || ''));
  const key = sorted.map(p => `${p.id}:${p.SkinId}`).join(',');
  if (key !== rosterKey) {
    rosterKey = key;
    list.innerHTML = sorted.map(p => `
      <div class=it data-id="${p.id}">
        <span class=gi>${headHtml(p.SkinId)}</span>
        <span class=nm><div class=u>${escapeHtml(p.Username || '?')}</div><div class="s mono"></div></span>
        <span class="pg mono"></span>
      </div>`).join('');
    list.querySelectorAll('.it').forEach(el => el.addEventListener('click', () => {
      const id = Number(el.dataset.id);
      const p = lastPlayers.find(q => q.id === id);
      if (!p) return;
      setFollow(id, p.Username);
      const pos = p.Pose?.Head?.Position;
      if (pos && followId === id) map.setView(toLatLng(pos[0], pos[2]), Math.max(map.getZoom(), BASE_ZOOM - 1));
    }));
  }
  // per-poll updates happen in place so the list doesn't flicker or lose scroll position
  for (const el of list.querySelectorAll('.it')) {
    const p = sorted.find(q => q.id === Number(el.dataset.id));
    if (!p) continue;
    el.querySelector('.s').textContent = p.PlayTime || '';
    el.querySelector('.pg').textContent = `${Math.round(p.ping || 0)}ms`;
  }
  syncSel();
}

// suspend the marker glide transition while zooming so Leaflet can reposition icons instantly
map.on('zoomstart', () => document.getElementById('map').classList.add('nozoomanim'));
map.on('zoomend', () => setTimeout(() => document.getElementById('map').classList.remove('nozoomanim'), 60));

async function poll() {
  try {
    const r = await fetch(PLAYERS_API, { cache: 'no-store' });
    const d = await r.json();
    lastPlayers = d.players || [];
    document.getElementById('statusDot').classList.add('on');
    updateMarkers(lastPlayers);
    renderList(lastPlayers);
  } catch (e) {
    document.getElementById('statusDot').classList.remove('on');
  } finally {
    setTimeout(poll, POLL_MS);
  }
}
poll();
</script>
</body>
</html>
