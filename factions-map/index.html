<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name=description content="Wolver Factions Map — live player map for FactionsVR">
<title>Wolver Factions Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
@font-face{font-family:MC;src:url(Minecraft.otf);font-weight:normal}
@font-face{font-family:MC;src:url(Minecraft-Bold.otf);font-weight:bold}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
body{font-family:MC,monospace;color:#fff;-webkit-font-smoothing:none;font-smooth:never}
.sh{text-shadow:2px 2px #3e3e3e}         /* classic MC text shadow (25% brightness) */
.gray{color:#aaa;text-shadow:2px 2px #2a2a2a}
.yellow{color:#ffff55;text-shadow:2px 2px #3e3e15}

#map{position:fixed;inset:0;background:#000;cursor:grab}
#map:active{cursor:grabbing}
.leaflet-container{background:#000;font:inherit}

/* ── MC widgets ── */
.mcbtn{font-family:MC,monospace;font-size:16px;color:#fff;text-shadow:2px 2px #3e3e3e;cursor:pointer;
  background:#6d6d6d;border:2px solid;border-color:#a6a6a6 #383838 #383838 #a6a6a6;outline:2px solid #000;
  padding:6px 14px 8px;user-select:none}
.mcbtn:hover{background:#7c81b8;border-color:#b6baE6 #43436e #43436e #b6bae6}
.mcbtn:active{border-color:#383838 #a6a6a6 #a6a6a6 #383838}
.mcfield{display:flex;align-items:center;gap:8px;background:#000;border:2px solid #a0a0a0;outline:2px solid #000;
  padding:5px 9px 7px;height:38px}
.mcfield:focus-within{border-color:#fff}
.mcfield .lab{color:#aaa;font-size:14px;text-shadow:2px 2px #2a2a2a}
.mcfield input{width:64px;background:none;border:0;outline:0;color:#fff;font-family:MC,monospace;font-size:16px}
.mcfield input::-webkit-outer-spin-button,.mcfield input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* ── top bar ── */
#bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 14px;background:rgba(0,0,0,.62);border-bottom:2px solid #000}
#bar .title{font-weight:bold;font-size:20px;padding-right:2px}
#bar .sub{font-size:14px;margin-top:2px}
.spacer{flex:1}
.online{display:flex;align-items:center;gap:9px;font-size:16px;padding:0 6px}

/* MC connection bars */
.bars{display:inline-flex;align-items:flex-end;gap:2px;height:20px;padding-bottom:2px}
.bars i{width:4px;background:#3a3a3a;display:block}
.bars i.on{background:#00e600}
.bars.bad i.on{background:#e63c3c}

/* ── player list (tab-list style) ── */
#side{position:fixed;top:66px;right:12px;bottom:12px;z-index:15;width:252px;
  background:rgba(0,0,0,.62);border:2px solid #000;padding:8px;display:flex;flex-direction:column}
#side.hidden{display:none}
#side h4{font-size:16px;font-weight:normal;text-align:center;padding:2px 0 8px;color:#fff;text-shadow:2px 2px #3e3e3e}
#playerList{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#playerList::-webkit-scrollbar{width:10px}
#playerList::-webkit-scrollbar-track{background:#000}
#playerList::-webkit-scrollbar-thumb{background:#6d6d6d;border:2px solid #000}
.it{display:flex;align-items:center;gap:9px;padding:4px 7px;cursor:pointer;background:rgba(255,255,255,.10);border:2px solid transparent}
.it:hover{background:rgba(255,255,255,.22)}
.it.on{border-color:#fff;background:rgba(255,255,255,.16)}
.it .gi{width:24px;height:24px;flex:0 0 24px;position:relative;overflow:hidden;background:#333;
  box-shadow:0 0 0 2px rgba(0,0,0,.55)}
.it .nm{flex:1;min-width:0}
.it .nm .u{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px #3e3e3e}
.it .nm .s{font-size:12px;color:#aaa;text-shadow:2px 2px #2a2a2a}
.it .pgslot{font-size:12px;color:#aaa;text-shadow:2px 2px #2a2a2a;text-align:right;flex:none;white-space:nowrap}
.pempty{color:#aaa;font-size:14px;text-align:center;padding:14px 0;text-shadow:2px 2px #2a2a2a}

/* ── F3-style coords, bottom left ── */
#f3{position:fixed;left:8px;bottom:8px;z-index:15;font-size:15px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
#f3 div{background:rgba(80,80,80,.55);padding:1px 5px 3px;width:max-content;text-shadow:none}

/* ── actionbar follow note, bottom center ── */
#followNote{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);z-index:16;display:none;
  font-size:16px;color:#ffff55;text-shadow:2px 2px #3e3e15;background:rgba(0,0,0,.35);padding:4px 12px 6px;cursor:pointer}
#followNote.on{display:block}

/* ── player heads / markers ── */
.face,.hat{position:absolute;inset:0;background-repeat:no-repeat;image-rendering:pixelated}
.gi .face{background-size:192px auto;background-position:-24px -24px}
.gi .hat{background-size:192px auto;background-position:-120px -24px}
.pmarker{position:relative}
.pmarker .mhead{position:absolute;left:-14px;top:-14px;width:28px;height:28px;overflow:hidden;background:#333;
  box-shadow:0 0 0 2px #000}
.pmarker .mhead .face{background-size:224px auto;background-position:-28px -28px}
.pmarker .mhead .hat{background-size:224px auto;background-position:-140px -28px}
.pmarker .mname{position:absolute;top:17px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:10px;color:#fff;background:rgba(0,0,0,.4);padding:1px 4px 2px;pointer-events:none;text-shadow:1px 1px #3e3e3e}
.pmarker.sel .mhead{box-shadow:0 0 0 2px #fff}
.pmarker.sel .mname{color:#ffff55;text-shadow:2px 2px #3e3e15}
.pmarker .arrow{position:absolute;left:-6px;top:-27px;width:12px;height:12px;pointer-events:none;transform-origin:6px 27px;
  filter:drop-shadow(1px 1px 0 #000)}
.pmarker .arrow::before{content:"";position:absolute;left:2px;top:1px;border:4px solid transparent;
  border-bottom:7px solid #fff;border-top:none}

/* ── extensions panel (MC options-screen style) ── */
#extPanel{position:fixed;top:66px;z-index:25;display:none;flex-direction:column;gap:8px;width:220px;
  background:rgba(0,0,0,.62);border:2px solid #000;padding:8px}
#extPanel.open{display:flex}
#extPanel h4{font-size:14px;font-weight:normal;text-align:center;padding-bottom:2px;text-shadow:2px 2px #3e3e3e}
#extPanel .mcbtn{width:100%;font-size:14px}
#extPanel .exthint{font-size:11px;color:#888;text-shadow:1px 1px #1a1a1a;line-height:1.35;padding:2px 2px 0}

/* ── base finder ── */
.basemark{position:relative}
.basemark .flag{position:absolute;left:-1px;top:-16px;width:15px;height:11px;background:#c98a2e;
  border:2px solid;border-color:#e6b45c #7a5015 #7a5015 #e6b45c;box-shadow:0 0 0 2px rgba(0,0,0,.5)}
.basemark .pole{position:absolute;left:-1px;top:-16px;width:2px;height:20px;background:#3a2c18;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.basemark.med .flag{background:#b06a2a;border-color:#d0904a #6a3d12 #6a3d12 #d0904a}
.basemark.low .flag{background:#6d6d6d;border-color:#9a9a9a #383838 #383838 #9a9a9a}
.basemark .blabel{position:absolute;left:16px;top:-16px;white-space:nowrap;font-size:10px;color:#ffd98a;
  text-shadow:1px 1px #000;background:rgba(0,0,0,.45);padding:0 4px 2px;pointer-events:none}
/* 2atabase panel */
#dbPanel{position:fixed;top:66px;left:12px;bottom:12px;z-index:25;display:none;flex-direction:column;width:274px;
  background:rgba(0,0,0,.66);border:2px solid #000;padding:8px}
#dbPanel.open{display:flex}
#dbPanel h4{font-size:14px;font-weight:normal;text-align:center;padding-bottom:6px;text-shadow:2px 2px #3e3e3e}
.dbnote{font-size:11px;color:#ffd98a;text-shadow:1px 1px #000;background:rgba(120,90,20,.22);
  border:1px solid #6a5015;padding:5px 7px;margin-bottom:7px;line-height:1.35}
#dbSearch{font-family:MC,monospace;background:#000;border:2px solid #a0a0a0;color:#fff;font-size:14px;
  padding:6px 8px;margin-bottom:7px;outline:0}
#dbSearch:focus{border-color:#fff}
#dbSearch::placeholder{color:#666}
#dbList{overflow-y:auto;display:flex;flex-direction:column;gap:2px}
#dbList::-webkit-scrollbar{width:10px}
#dbList::-webkit-scrollbar-track{background:#000}
#dbList::-webkit-scrollbar-thumb{background:#6d6d6d;border:2px solid #000}
.dbit{display:flex;align-items:center;gap:8px;padding:5px 7px;cursor:pointer;background:rgba(255,255,255,.08);border:2px solid transparent}
.dbit:hover{background:rgba(255,255,255,.2)}
.dbit .nm{flex:1;min-width:0}
.dbit .u{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px #3e3e3e}
.dbit .s{font-size:11px;color:#aaa;text-shadow:1px 1px #2a2a2a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbconf{font-size:13px;color:#ffd98a;text-shadow:1px 1px #4a3410;flex:none}

/* ── dirt loading screen ── */
#load{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:#000;transition:opacity .4s;image-rendering:pixelated}
#load .msg{font-size:20px;color:#ddd;text-shadow:2px 2px #373737}

@media(max-width:820px){
  .mcfield,#gobtn{display:none}
  #bar .sub{display:none}
  #side{width:212px}
}
</style>
</head>
<body>

<div id=map></div>
<div id=load><div class="msg" id=loadMsg>Loading terrain...</div></div>

<div id=bar>
  <div>
    <div class="title sh">WFM</div>
  </div>
  <div class=spacer></div>
  <div class=mcfield><span class=lab>X</span><input id=gotoX type=number placeholder=0></div>
  <div class=mcfield><span class=lab>Z</span><input id=gotoZ type=number placeholder=0></div>
  <button class=mcbtn id=extbtn onclick=toggleExtPanel()>Extensions</button>
  <button class=mcbtn id=dbbtn onclick=toggleDbPanel()>2atabase</button>
  <button class=mcbtn id=gobtn onclick=goToCoords()>Go</button>
  <button class=mcbtn onclick=refreshTiles()>Reload</button>
  <button class=mcbtn onclick=toggleSidebar()>List</button>
  <div class=online>
    <span class=bars id=connBars><i style=height:6px></i><i style=height:9px></i><i style=height:12px></i><i style=height:15px></i><i style=height:18px></i></span>
    <span class=sh><b id=onlineCount>--</b> online</span>
  </div>
</div>

<div id=side>
  <h4 id=playerCount>Players</h4>
  <div id=playerList><div class=pempty>Loading...</div></div>
</div>

<div id=f3 class=mono>
  <div>Block: <span id=statXZ>-- --</span></div>
  <div>Chunk: <span id=statC>-- --</span></div>
</div>

<div id=followNote onclick=stopFollow() title="Click to stop following">Following <span id=followName></span></div>

<div id=extPanel>
  <h4>Extensions</h4>
  <button class=mcbtn data-ext=y onclick="toggleExt('y')">Y Axis: OFF</button>
</div>

<div id=dbPanel>
  <h4>2atabase</h4>
  <div class=dbnote>Still collecting &amp; analyzing data &mdash; it will likely take 1 week+ of tracking to get accurate base coordinates.</div>
  <input id=dbSearch placeholder="Search player..." oninput=renderDbList() autocomplete=off spellcheck=false>
  <div id=dbList><div class=pempty>Open to load...</div></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ═══ Config ═══
const FVR = 'https://factionsvr.com';                                   // tiles + skins (plain <img>, no CORS needed)
const PLAYERS_API = 'https://admin.wolver002.com/factions/api/players'; // our CORS proxy on the wolver server
const POLL_MS = 1000; // matches the official map's refresh rate

// Tile scheme (mirrors the official map exactly so tiles line up)
const CHUNK_SIZE = 16, TILE_SIZE = 256, BASE_ZOOM = 8, MIN_ZOOM = 0, MAX_ZOOM = 11;
const UPB = (TILE_SIZE / Math.pow(2, BASE_ZOOM)) / CHUNK_SIZE; // CRS units per block
let cacheBuster = Date.now();
const toLatLng = (x, z) => [-z * UPB, x * UPB];

// ═══ Dirt loading screen (16x16 random browns, like the classic dirt screen) ═══
(() => {
  const c = document.createElement('canvas'); c.width = c.height = 16;
  const g = c.getContext('2d');
  const P = ['#5a3d26','#66452b','#704c30','#79553a','#5f4130','#6b4a33'];
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
    g.fillStyle = P[Math.floor(Math.random() * P.length)]; g.fillRect(x, y, 1, 1);
  }
  const el = document.getElementById('load');
  el.style.background = `url(${c.toDataURL()})`;
  el.style.backgroundSize = '64px 64px';
  // darken like the real loading screen
  el.style.boxShadow = 'inset 0 0 0 100vmax rgba(0,0,0,.55)';
})();
let loadDots = 0;
const loadTick = setInterval(() => {
  const m = document.getElementById('loadMsg');
  if (m) m.textContent = 'Loading terrain' + '.'.repeat(1 + (loadDots++ % 3));
}, 400);

// ═══ Map ═══
const map = L.map('map', {
  crs: L.CRS.Simple, center: toLatLng(175.5, 414.5), zoom: BASE_ZOOM - 4,
  minZoom: MIN_ZOOM, maxZoom: MAX_ZOOM, zoomControl: false, attributionControl: false
});
// recover if the container was 0-sized at init (hidden tab/embed) or gets resized
new ResizeObserver(() => map.invalidateSize()).observe(document.getElementById('map'));

L.TileLayer.ChunkLayer = L.TileLayer.extend({
  getTileUrl(coords) {
    const tz = coords.z - BASE_ZOOM;
    if (tz >= 0) {
      const s = Math.pow(2, tz);
      return `${FVR}/api/map/chunk/0/${Math.floor(coords.x/s)}/${Math.floor(coords.y/s)}?t=${cacheBuster}`;
    }
    return `${FVR}/api/map/chunk/${tz}/${coords.x}/${coords.y}?t=${cacheBuster}`;
  },
  createTile(coords, done) {
    const tile = document.createElement('img');
    tile.alt = ''; tile.style.imageRendering = 'pixelated';
    tile.onload = () => done(null, tile);
    tile.onerror = () => { tile.style.visibility = 'hidden'; done(null, tile); };
    tile.src = this.getTileUrl(coords);
    return tile;
  }
});
const tileLayer = new L.TileLayer.ChunkLayer('', {
  tileSize: TILE_SIZE, noWrap: true, keepBuffer: 8,
  updateWhenZooming: false, updateWhenIdle: false,
  bounds: [[-1e9,-1e9],[1e9,1e9]], maxNativeZoom: BASE_ZOOM, minNativeZoom: MIN_ZOOM,
  errorTileUrl: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'
}).addTo(map);

tileLayer.once('load', hideLoading);
setTimeout(hideLoading, 6000); // safety net if a tile hangs

function hideLoading() {
  const el = document.getElementById('load');
  if (!el || el.style.opacity === '0') return;
  el.style.opacity = '0';
  setTimeout(() => { el.remove(); clearInterval(loadTick); }, 450);
}

// ═══ F3 coords / controls ═══
map.on('mousemove', e => {
  const x = Math.floor(e.latlng.lng / UPB), z = -Math.ceil(e.latlng.lat / UPB);
  document.getElementById('statXZ').textContent = `${x} ${z}`;
  document.getElementById('statC').textContent = `${Math.floor(x/16)} ${Math.floor(z/16)}`;
});
function goToCoords() {
  const x = parseInt(document.getElementById('gotoX').value) || 0;
  const z = parseInt(document.getElementById('gotoZ').value) || 0;
  map.setView(toLatLng(x, z), Math.max(map.getZoom(), BASE_ZOOM - 2));
}
function refreshTiles() { cacheBuster = Date.now(); tileLayer.redraw(); }
document.querySelectorAll('.mcfield input').forEach(i =>
  i.addEventListener('keydown', e => { if (e.key === 'Enter') goToCoords(); }));

// ═══ Extensions ═══
const ext = {
  y: localStorage.getItem('ext.y') === '1', // Y axis off by default
};
function syncExtButtons() {
  document.querySelectorAll('#extPanel [data-ext]').forEach(b => {
    const k = b.dataset.ext, on = !!ext[k];
    b.textContent = b.textContent.replace(/: (ON|OFF)$/, `: ${on ? 'ON' : 'OFF'}`);
  });
}
function toggleExt(k) {
  ext[k] = !ext[k];
  localStorage.setItem('ext.' + k, ext[k] ? '1' : '0');
  syncExtButtons();
}
function toggleExtPanel() {
  const p = document.getElementById('extPanel');
  const open = !p.classList.contains('open');
  p.classList.toggle('open', open);
  if (open) {
    const r = document.getElementById('extbtn').getBoundingClientRect();
    p.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 236)) + 'px';
  }
}
syncExtButtons();

let sidebarOpen = true;
function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('side').classList.toggle('hidden', !sidebarOpen);
}

// ═══ Players ═══
const markers = new Map();   // id -> {marker, skin}
let followId = null;
let lastPlayers = [];

const skinUrl = id => `${FVR}/api/game/skin/image/${id}`;
function headHtml(skinId) {
  const bg = skinId ? `style="background-image:url('${skinUrl(skinId)}')"` : '';
  return `<div class=face ${bg}></div><div class=hat ${bg}></div>`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Admins get a colored name (yellow, frikilul blue). [color, shadow] — matched case-insensitively.
const ADMINS = {
  luminexreal:   ['#ffff55', '#3e3e15'],
  frikilul:      ['#5c6bff', '#171a3e'],
  shoemake82:    ['#ffff55', '#3e3e15'],
  skeletonangel: ['#ffff55', '#3e3e15'],
  burningalpaca: ['#ffff55', '#3e3e15'],
  realdowd:      ['#ffff55', '#3e3e15'],
};
function adminStyle(name, px) {
  const a = ADMINS[(name || '').toLowerCase()];
  return a ? `color:${a[0]};text-shadow:${px}px ${px}px ${a[1]}` : '';
}

function markerIcon(p, selected) {
  const heading = p.Pose?.Heading ?? 0;
  return L.divIcon({
    className: '', iconSize: [0, 0],
    html: `<div class="pmarker${selected ? ' sel' : ''}">
      <div class=arrow style="transform:rotate(${-heading}deg)"></div>
      <div class=mhead>${headHtml(p.SkinId)}</div>
      <div class=mname style="${adminStyle(p.Username, 1)}">${escapeHtml(p.Username || '?')}</div>
    </div>`
  });
}

function setFollow(id, name) {
  followId = (followId === id) ? null : id;
  const note = document.getElementById('followNote');
  note.classList.toggle('on', !!followId);
  if (followId) document.getElementById('followName').textContent = name;
  syncSel();
}
function stopFollow() { followId = null; document.getElementById('followNote').classList.remove('on'); syncSel(); }

function syncSel() {
  document.querySelectorAll('#playerList .it').forEach(el =>
    el.classList.toggle('on', followId === Number(el.dataset.id)));
  for (const [id, e] of markers)
    e.marker.getElement()?.querySelector('.pmarker')?.classList.toggle('sel', followId === id);
}

function updateMarkers(players) {
  const seen = new Set();
  for (const p of players) {
    const pos = p.Pose?.Head?.Position;
    if (!pos) continue;
    seen.add(p.id);
    const ll = toLatLng(pos[0], pos[2]);
    let e = markers.get(p.id);
    if (!e) {
      const m = L.marker(ll, { icon: markerIcon(p, followId === p.id) }).addTo(map);
      m.on('click', () => setFollow(p.id, p.Username));
      e = { marker: m, skin: p.SkinId };
      markers.set(p.id, e);
    } else {
      // update in place — recreating the icon every poll causes flicker
      e.marker.setLatLng(ll);
      const root = e.marker.getElement()?.querySelector('.pmarker');
      if (root) {
        root.querySelector('.arrow').style.transform = `rotate(${-(p.Pose?.Heading ?? 0)}deg)`;
        if (e.skin !== p.SkinId) {
          e.skin = p.SkinId;
          root.querySelectorAll('.face,.hat').forEach(d => d.style.backgroundImage = `url('${skinUrl(p.SkinId)}')`);
        }
      }
    }
    if (followId === p.id) map.panTo(ll, { animate: false });
  }
  for (const [id, m] of markers) {
    if (!seen.has(id)) { map.removeLayer(m.marker); markers.delete(id); if (followId === id) stopFollow(); }
  }
}

let rosterKey = '';
function renderList(players) {
  const list = document.getElementById('playerList');
  document.getElementById('onlineCount').textContent = players.length;
  document.getElementById('playerCount').textContent = players.length ? `Players — ${players.length}` : 'Players';
  if (!players.length) { list.innerHTML = '<div class=pempty>No players online</div>'; rosterKey = ''; return; }
  const sorted = [...players].sort((a, b) => (a.Username || '').localeCompare(b.Username || ''));
  const key = sorted.map(p => `${p.id}:${p.SkinId}`).join(',');
  if (key !== rosterKey) {
    rosterKey = key;
    list.innerHTML = sorted.map(p => `
      <div class=it data-id="${p.id}">
        <span class=gi>${headHtml(p.SkinId)}</span>
        <span class=nm><div class=u style="${adminStyle(p.Username, 2)}">${escapeHtml(p.Username || '?')}</div><div class=s></div></span>
        <span class=pgslot></span>
      </div>`).join('');
    list.querySelectorAll('.it').forEach(el => el.addEventListener('click', () => {
      const id = Number(el.dataset.id);
      const p = lastPlayers.find(q => q.id === id);
      if (!p) return;
      setFollow(id, p.Username);
      const pos = p.Pose?.Head?.Position;
      if (pos && followId === id) map.setView(toLatLng(pos[0], pos[2]), Math.max(map.getZoom(), BASE_ZOOM - 1));
    }));
  }
  // per-poll updates happen in place so the list doesn't flicker or lose scroll position
  for (const el of list.querySelectorAll('.it')) {
    const p = sorted.find(q => q.id === Number(el.dataset.id));
    if (!p) continue;
    el.querySelector('.s').textContent = p.PlayTime || '';
    const pos = p.Pose?.Head?.Position;
    el.querySelector('.pgslot').textContent = !pos ? '' :
      ext.y ? `${Math.floor(pos[0])}, ${Math.floor(pos[1])}, ${Math.floor(pos[2])}`
            : `${Math.floor(pos[0])}, ${Math.floor(pos[2])}`;
  }
  syncSel();
}

// ═══ 2atabase (base finder) ═══
const BASES_API = 'https://admin.wolver002.com/factions/api/bases';
let baseData = [];        // latest bases from the server
let dbTimer = null, dbOpen = false, selBaseMarker = null;

function baseIcon(b) {
  const cls = b.confidence >= 60 ? '' : b.confidence >= 30 ? ' med' : ' low';
  return L.divIcon({
    className: '', iconSize: [0, 0],
    html: `<div class="basemark${cls}"><div class=pole></div><div class=flag></div>
      <div class=blabel>${escapeHtml(b.username)} ${b.confidence}%</div></div>`
  });
}

function toggleDbPanel() {
  dbOpen = !dbOpen;
  document.getElementById('dbPanel').classList.toggle('open', dbOpen);
  if (dbOpen) {
    refreshBases();
    clearInterval(dbTimer);
    dbTimer = setInterval(refreshBases, 15000);
  } else {
    clearInterval(dbTimer); dbTimer = null;
  }
}

async function refreshBases() {
  try { const d = await (await fetch(BASES_API, { cache: 'no-store' })).json(); baseData = d.bases || []; }
  catch (e) { return; }
  renderDbList();
}

function renderDbList() {
  const list = document.getElementById('dbList');
  const q = (document.getElementById('dbSearch').value || '').trim().toLowerCase();
  if (!baseData.length) { list.innerHTML = '<div class=pempty>No bases mapped yet</div>'; return; }
  const rows = baseData.filter(b => (b.username || '').toLowerCase().includes(q));
  if (!rows.length) { list.innerHTML = '<div class=pempty>No players match</div>'; return; }
  list.innerHTML = rows.map(b => {
    const time = b.minutes < 60 ? b.minutes + 'min' : (b.minutes / 60).toFixed(1) + 'hr';
    return `<div class=dbit data-id="${b.id}">
      <span class=nm>
        <div class=u style="${adminStyle(b.username, 2)}">${escapeHtml(b.username)}</div>
        <div class=s>${b.x}, ${b.y}, ${b.z} &middot; ${time} &middot; ${b.sessions} visit${b.sessions === 1 ? '' : 's'} &middot; ${b.spawnDist}b from spawn</div>
      </span>
      <span class=dbconf>${b.confidence}%</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.dbit').forEach(el => el.addEventListener('click', () => selectBase(Number(el.dataset.id))));
}

// clicking a result drops a single marker at that player's estimated base and pans to it
function selectBase(id) {
  const b = baseData.find(x => x.id === id); if (!b) return;
  const ll = toLatLng(b.x, b.z);
  if (!selBaseMarker) selBaseMarker = L.marker(ll, { icon: baseIcon(b), zIndexOffset: 1000 }).addTo(map);
  else { selBaseMarker.setLatLng(ll); selBaseMarker.setIcon(baseIcon(b)); }
  map.setView(ll, Math.max(map.getZoom(), BASE_ZOOM - 1));
}

async function poll() {
  const t0 = Date.now();
  try {
    const r = await fetch(PLAYERS_API, { cache: 'no-store' });
    const d = await r.json();
    lastPlayers = d.players || [];
    document.getElementById('connBars').classList.remove('bad');
    document.getElementById('connBars').querySelectorAll('i').forEach(b => b.classList.add('on'));
    updateMarkers(lastPlayers);
    renderList(lastPlayers);
  } catch (e) {
    const cb = document.getElementById('connBars');
    cb.classList.add('bad');
    cb.querySelectorAll('i').forEach((b, i) => b.classList.toggle('on', i === 0));
    document.getElementById('onlineCount').textContent = '--';
  } finally {
    // fixed 1s cadence like the official map: don't let request time stretch the interval
    setTimeout(poll, Math.max(150, POLL_MS - (Date.now() - t0)));
  }
}
poll();
